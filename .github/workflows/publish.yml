name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vet-fmt:
    name: Build, vet, gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: $unformatted"
            exit 1
          fi

  test-race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -race

  coverage-gate:
    name: 90% statement coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -coverprofile=cover.out
      - name: Enforce ≥90% coverage
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${pct}%"
          ok=$(awk -v p="$pct" 'BEGIN { print (p+0 >= 90) ? "true" : "false" }')
          if [ "$ok" != "true" ]; then
            echo "::error::coverage ${pct}% < 90%"
            exit 1
          fi

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: golangci-lint run

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install trufflehog
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: trufflehog filesystem . --only-verified --fail

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          tmp=$(mktemp -d)
          curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep "browser_download_url.*linux_x64.tar.gz" \
            | cut -d '"' -f 4 \
            | xargs curl -sSfL -o "$tmp/gitleaks.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/gitleaks" "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --redact --verbose

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs web/dist

  trivy-image:
    name: Trivy container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/system-wrangler-frontend
          path: _frontend
          ref: main
          token: ${{ secrets.FRONTEND_TOKEN }}
      - name: Install trivy
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build image for scan
        run: |
          docker buildx build \
            --build-context frontend=_frontend \
            --tag system-wrangler:ci \
            --load \
            --file Containerfile \
            .
      - name: Scan final image
        run: |
          trivy image system-wrangler:ci \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library
      - name: Build frontend-build stage
        run: |
          docker buildx build \
            --build-context frontend=_frontend \
            --target frontend-build \
            --tag system-wrangler-frontend-build:ci \
            --load \
            --file Containerfile \
            .
      - name: Scan frontend-build stage
        run: |
          trivy image system-wrangler-frontend-build:ci \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library

  dco:
    name: DCO sign-off on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push)
              base="${PUSH_BEFORE}"
              head="${GITHUB_SHA}"
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base=""
              fi
              ;;
            workflow_dispatch)
              base=""
              head="$(git rev-parse HEAD)"
              ;;
            *)
              echo "DCO check not configured for event: ${GITHUB_EVENT_NAME}" >&2
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            shas="$head"
          else
            shas="$(git rev-list "$base..$head")"
          fi
          missing=0
          for sha in $shas; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+'; then
              echo "::error::commit $sha is missing a Signed-off-by line (use 'git commit -s')"
              missing=1
            fi
          done
          exit $missing

  frontend-gates:
    name: Frontend typecheck, lint, test, 90% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/system-wrangler-frontend
          ref: main
          token: ${{ secrets.FRONTEND_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run --coverage
      - name: Enforce ≥90% line coverage
        run: |
          set -euo pipefail
          pct=$(node -e "console.log(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct)")
          echo "frontend coverage: ${pct}%"
          ok=$(node -e "process.stdout.write(String(Number(process.argv[1]) >= 90))" "$pct")
          if [ "$ok" != "true" ]; then
            echo "::error::frontend coverage ${pct}% < 90%"
            exit 1
          fi

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs:
      - build-vet-fmt
      - test-race
      - coverage-gate
      - golangci-lint
      - govulncheck
      - trufflehog
      - gitleaks
      - trivy-fs
      - trivy-image
      - frontend-gates
      - dco
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      FRONTEND_TOKEN: ${{ secrets.FRONTEND_TOKEN }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Refuse to publish without IMAGE_NAME configured
        run: |
          if [ -z "${IMAGE_NAME}" ]; then
            echo "::error::vars.IMAGE_NAME is not set on this repository; refusing to publish."
            echo "Set IMAGE_NAME (e.g. registry.example.com/system-wrangler/backend) in the repo Variables."
            exit 1
          fi

      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/system-wrangler-frontend
          path: _frontend
          ref: main
          token: ${{ env.FRONTEND_TOKEN }}

      - name: Set up QEMU (multi-arch emulation, GitHub only)
        if: github.server_url == 'https://github.com'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64,s390x,ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide build platforms
        id: platforms
        run: |
          set -euo pipefail
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "platforms=linux/amd64,linux/arm64,linux/riscv64,linux/s390x,linux/ppc64le" >> "$GITHUB_OUTPUT"
          else
            arch=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
            echo "platforms=linux/${arch}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          ref_name="${GITHUB_REF_NAME:-main}"
          tags="${IMAGE_NAME}:${short_sha}"
          if [ "${ref_name}" = "main" ]; then
            tags="${tags},${IMAGE_NAME}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${IMAGE_NAME}:${ref_name}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Compute build args
        id: build-args
        run: |
          set -euo pipefail
          echo "backend_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$(git -C _frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Registry login
        if: env.REGISTRY_USER != '' && env.REGISTRY_TOKEN != ''
        run: |
          echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY:-${IMAGE_NAME%%/*}}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          build-contexts: |
            frontend=_frontend
          build-args: |
            BACKEND_SHA=${{ steps.build-args.outputs.backend_sha }}
            FRONTEND_SHA=${{ steps.build-args.outputs.frontend_sha }}
            BUILD_DATE=${{ steps.build-args.outputs.build_date }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
