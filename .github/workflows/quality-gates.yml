name: quality-gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vet-fmt:
    name: Build, vet, gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: the following files need formatting"
            echo "$unformatted"
            exit 1
          fi

  test-race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./... -race -timeout 30m

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - run: golangci-lint run

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          tmp=$(mktemp -d)
          curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep "browser_download_url.*linux_x64.tar.gz" \
            | cut -d '"' -f 4 \
            | xargs curl -sSfL -o "$tmp/gitleaks.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/gitleaks" "$HOME/bin/gitleaks"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --redact --verbose

  dco:
    name: DCO sign-off on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base="${PR_BASE}"
              head="${PR_HEAD}"
              ;;
            push)
              base="${PUSH_BEFORE}"
              head="${GITHUB_SHA}"
              # First push to a branch sets `before` to the all-zero
              # SHA; in that case fall back to checking only the tip.
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base=""
              fi
              ;;
            workflow_dispatch)
              base=""
              head="$(git rev-parse HEAD)"
              ;;
            *)
              echo "DCO check not configured for event: ${GITHUB_EVENT_NAME}" >&2
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            shas="$head"
          else
            shas="$(git rev-list "$base..$head")"
          fi
          missing=0
          for sha in $shas; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+'; then
              echo "::error::commit $sha is missing a Signed-off-by line (use 'git commit -s')"
              missing=1
            fi
          done
          exit $missing
