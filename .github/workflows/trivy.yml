# Trivy vulnerability scan: source-tree dependencies + built container image.
# Runs on push to main and on every pull request. Works on both GitHub
# Actions and Gitea Actions; Gitea reads workflows from .github/workflows/
# as well as .gitea/workflows/.

name: trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-scan:
    name: Filesystem scan (go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run trivy on the working tree
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Skip Trivy DB cache between runs so we always pick up the
          # latest CVE feed. Comment out if cache misses become slow.
          skip-dirs: web/dist

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    # FRONTEND_TOKEN must be a Gitea (or GitHub) personal access token
    # with read access to system-wrangler-frontend. The Containerfile
    # consumes the frontend repo via --build-context, so the image-scan
    # job needs to clone both repos before building.
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: jason/system-wrangler-frontend
          path: _frontend
          ref: main
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker buildx build \
            --build-context frontend=_frontend \
            --tag system-wrangler:ci \
            --load \
            --file Containerfile \
            .

      - name: Run trivy on the built image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: system-wrangler:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library
