# Trivy vulnerability scan: source-tree dependencies + built container image.
# Runs on push to main and on every pull request. Works on both GitHub
# Actions and Gitea Actions; Gitea reads workflows from .github/workflows/
# as well as .gitea/workflows/.
#
# The official aquasecurity/trivy-action does its own actions/checkout of
# the upstream trivy repo on github.com to fetch an install script, which
# fails on Gitea runners that have no github.com credentials. To stay
# portable we install the trivy binary ourselves and invoke it directly,
# matching the trufflehog.yml approach.

name: trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fs-scan:
    name: Filesystem scan (go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install trivy
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin"
          "$HOME/bin/trivy" --version

      - name: Run trivy on the working tree
        run: |
          "$HOME/bin/trivy" fs . \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs web/dist

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    # FRONTEND_TOKEN must be a Gitea (or GitHub) personal access token
    # with read access to system-wrangler-frontend. The Containerfile
    # consumes the frontend repo via --build-context, so the image-scan
    # job needs to clone both repos before building.
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/system-wrangler-frontend
          path: _frontend
          ref: main
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Install trivy
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/bin"
          "$HOME/bin/trivy" --version

      - name: Build container image
        run: |
          docker buildx build \
            --build-context frontend=_frontend \
            --tag system-wrangler:ci \
            --load \
            --file Containerfile \
            .

      - name: Run trivy on the built image
        run: |
          docker save system-wrangler:ci -o /tmp/image.tar
          "$HOME/bin/trivy" image --input /tmp/image.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library

      # Multi-stage builds discard intermediate stages from the final
      # image, so the final-image scan above doesn't see the npm-build
      # environment (CentOS base + nodejs + npm + node_modules). Build
      # the frontend-build stage as its own image and scan it too — that
      # surfaces build-time supply-chain risks (base-image CVEs, a
      # compromised node package, etc.) that the runtime scan misses.
      - name: Build frontend-build stage
        run: |
          docker buildx build \
            --build-context frontend=_frontend \
            --target frontend-build \
            --tag system-wrangler-frontend-build:ci \
            --load \
            --file Containerfile \
            .

      - name: Run trivy on the frontend-build stage
        run: |
          docker save system-wrangler-frontend-build:ci -o /tmp/frontend-build.tar
          "$HOME/bin/trivy" image --input /tmp/frontend-build.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --vuln-type os,library
