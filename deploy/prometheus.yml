global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: system-wrangler

scrape_configs:
  - job_name: system-wrangler-exporters
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/sw-targets/targets.json
        refresh_interval: 5s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/sw-internal-secret
