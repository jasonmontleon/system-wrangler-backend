networks:
  default:
    name: podman
    external: true

services:
  system-wrangler:
    image: quay.io/jasonmontleon/system-wrangler:latest
    container_name: system-wrangler
    restart: unless-stopped
    # Give the server time to drain in-flight runs on shutdown before
    # podman force-kills it. Must be >= the shutdown_grace_seconds
    # setting (default 300s); the extra margin covers the rest of the
    # graceful-stop sequence. Raise both together if you increase the
    # setting. Runs still unfinished at force-kill are recovered (marked
    # failed, host lock cleared) on the next start regardless.
    stop_grace_period: 330s
    environment:
      SW_INTERNAL_SECRET_FILE: /etc/system-wrangler/internal-secret
      SW_TARGETS_FILE: /var/lib/sw-targets/targets.json
      SW_MASTER_KEY_FILE: /etc/system-wrangler/master.key
    ports:
      - "8080:8080"
    volumes:
      - sw-data:/var/lib/system-wrangler
      - sw-targets:/var/lib/sw-targets
      - ./master.key:/etc/system-wrangler/master.key:ro
      - ./internal-secret:/etc/system-wrangler/internal-secret:ro

  prometheus:
    image: quay.io/prometheus/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    network_mode: "service:system-wrangler"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./internal-secret:/etc/prometheus/sw-internal-secret:ro
      - sw-targets:/etc/prometheus/sw-targets:ro
      - prom-data:/prometheus
    depends_on:
      - system-wrangler

volumes:
  sw-data:
  sw-targets:
  prom-data:
