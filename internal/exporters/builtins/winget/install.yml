- name: Install windows_exporter (winget / Windows, localhost mode)
  hosts: all
  gather_facts: false
  become: false
  vars:
    sw_textfile_dir: 'C:\ProgramData\windows_exporter\textfile_collector'
    sw_reboot_script: 'C:\ProgramData\windows_exporter\sw-reboot-required.ps1'
    sw_reboot_task: 'sw-reboot-required'
  tasks:
    - name: Detect existing windows_exporter service
      ansible.windows.win_service:
        name: windows_exporter
      register: we_svc
      failed_when: false

    - name: Install Prometheus.WindowsExporter via winget
      when: not (we_svc.exists | default(false))
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        winget install --id Prometheus.WindowsExporter --exact --silent `
          --accept-source-agreements --accept-package-agreements
        exit $LASTEXITCODE
      register: winget_install
      changed_when: winget_install.stdout is search('Successfully installed', multiline=True)
      failed_when: winget_install.rc not in [0]

    - name: Stop windows_exporter before reconfiguring binPath
      ansible.windows.win_service:
        name: windows_exporter
        state: stopped
      failed_when: false

    - name: Ensure textfile collector directory exists
      ansible.windows.win_file:
        path: "{{ sw_textfile_dir }}"
        state: directory

    - name: Drop reboot-required textfile collector script
      ansible.windows.win_copy:
        dest: "{{ sw_reboot_script }}"
        content: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $out = '{{ sw_textfile_dir }}\sw_reboot_required.prom'
          $tmp = "$out.tmp"
          $needed = $false
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $needed = $true }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $needed = $true }
          $sm = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name 'PendingFileRenameOperations' -ErrorAction SilentlyContinue
          if ($sm -and $sm.PendingFileRenameOperations) { $needed = $true }
          $uev = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Updates' -Name 'UpdateExeVolatile' -ErrorAction SilentlyContinue
          if ($uev -and ($uev.UpdateExeVolatile -ne 0)) { $needed = $true }
          $val = if ($needed) { 1 } else { 0 }
          $body = @(
            '# HELP sw_reboot_required 1 if the host needs a reboot to apply staged updates.',
            '# TYPE sw_reboot_required gauge',
            "sw_reboot_required $val"
          ) -join "`n"
          [System.IO.File]::WriteAllText($tmp, $body + "`n", (New-Object System.Text.UTF8Encoding($false)))
          Move-Item -Force -Path $tmp -Destination $out

    - name: Register sw-reboot-required scheduled task (boot + 1 min cadence)
      ansible.windows.win_shell: |
        $taskName = '{{ sw_reboot_task }}'
        $script = '{{ sw_reboot_script }}'
        $action = New-ScheduledTaskAction -Execute 'powershell.exe' `
          -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$script`""
        $boot = New-ScheduledTaskTrigger -AtStartup
        $boot.Delay = 'PT30S'
        $repeat = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) `
          -RepetitionInterval (New-TimeSpan -Minutes 1)
        $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -RunLevel Highest -LogonType ServiceAccount
        $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
        Register-ScheduledTask -TaskName $taskName -Action $action `
          -Trigger @($boot, $repeat) -Principal $principal -Settings $settings -Force | Out-Null
        Start-ScheduledTask -TaskName $taskName
      changed_when: true

    - name: Run the reboot-required collector once so the metric exists immediately
      ansible.windows.win_shell: |
        & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '{{ sw_reboot_script }}'
      changed_when: false

    - name: Override windows_exporter binPath to bind 127.0.0.1:9182 and enable extra collectors (via WMI)
      ansible.windows.win_shell: |
        $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='windows_exporter'"
        if (-not $svc) { Write-Error 'windows_exporter service not found'; exit 1 }
        $exe = ($svc.PathName -replace '^"([^"]+)".*$', '$1')
        if (-not $exe -or -not (Test-Path $exe)) {
          Write-Error "windows_exporter binary path not resolved (PathName=$($svc.PathName))"
          exit 1
        }
        $newPath = '"' + $exe + '" --web.listen-address=127.0.0.1:9182 --collectors.enabled=[defaults],memory,tcp,textfile --collector.textfile.directory={{ sw_textfile_dir }}'
        $result = Invoke-CimMethod -InputObject $svc -MethodName Change -Arguments @{ PathName = $newPath }
        if ($result.ReturnValue -ne 0) {
          Write-Error "Win32_Service.Change failed: ReturnValue=$($result.ReturnValue)"
          exit $result.ReturnValue
        }
        Write-Output "binPath set to: $newPath"
      changed_when: true

    - name: Start windows_exporter (sc.exe so the SCM exit code surfaces)
      ansible.windows.win_shell: |
        & sc.exe start windows_exporter | Out-Null
        $rc = $LASTEXITCODE
        Start-Sleep -Seconds 3
        $status = (Get-Service -Name windows_exporter).Status
        Write-Output ("SC_RC=" + $rc)
        Write-Output ("STATUS=" + $status)
      register: sw_start
      changed_when: true
      failed_when: false

    - name: Dump windows_exporter Event Log entries (Application provider)
      when: sw_start.stdout is not search('STATUS=Running')
      ansible.windows.win_shell: |
        $appEvents = Get-WinEvent -FilterHashtable @{ LogName='Application'; ProviderName='windows_exporter' } -MaxEvents 5 -ErrorAction SilentlyContinue
        if ($appEvents) {
          $appEvents | Format-List TimeCreated,LevelDisplayName,Id,Message | Out-String
        }
        $scmEvents = Get-WinEvent -FilterHashtable @{ LogName='System'; ProviderName='Service Control Manager' } -MaxEvents 10 -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*windows_exporter*' }
        if ($scmEvents) {
          "--- SCM events ---" | Out-String
          $scmEvents | Format-List TimeCreated,LevelDisplayName,Id,Message | Out-String
        }
      register: sw_eventlog
      changed_when: false
      failed_when: false

    - name: Surface Event Log diagnostics
      when: sw_start.stdout is not search('STATUS=Running')
      ansible.builtin.debug:
        msg: "{{ (sw_eventlog.stdout | default('(no events captured)')).split('\n') }}"

    - name: Fail loudly if windows_exporter did not enter Running state
      when: sw_start.stdout is not search('STATUS=Running')
      ansible.builtin.fail:
        msg: "windows_exporter failed to start; SCM exit + Event Log output above. Most likely cause: invalid value for --collectors.enabled."

    - name: Probe exporter HTTP endpoint on localhost
      ansible.windows.win_uri:
        url: http://127.0.0.1:9182/metrics
        status_code: 200
        return_content: false
      register: sw_probe
      failed_when: false

    - name: Surface exporter port
      ansible.builtin.debug:
        msg: "SW_EXPORTER_PORT: 9182"

    - name: Surface exporter service name
      ansible.builtin.debug:
        msg: "SW_EXPORTER_SERVICE: windows_exporter"

    - name: Surface exporter state
      ansible.builtin.debug:
        msg: "SW_EXPORTER_STATE: {{ 'running' if sw_probe.status_code | default(0) == 200 else 'failed' }}"
