- name: Install node_exporter (dnf / localhost mode)
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_textfile_dir: /var/lib/node_exporter/textfile_collector
    sw_node_exporter_options: >-
      --web.listen-address=127.0.0.1:9100
      --collector.textfile.directory={{ sw_textfile_dir }}
    sw_reboot_script: /usr/local/libexec/sw-reboot-required.sh
  tasks:
    - name: Ensure dnf-utils is installed for needs-restarting
      ansible.builtin.dnf:
        name: dnf-utils
        state: present

    - name: Install node_exporter package
      ansible.builtin.dnf:
        name: node-exporter
        state: present

    - name: Ensure node_exporter system user exists
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Ensure textfile collector directory exists
      ansible.builtin.file:
        path: "{{ sw_textfile_dir }}"
        state: directory
        owner: node_exporter
        group: node_exporter
        mode: "0755"

    - name: Ensure libexec directory exists
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop reboot-required textfile collector script
      ansible.builtin.copy:
        dest: "{{ sw_reboot_script }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by System Wrangler. Edits will be overwritten.
          set -eu
          out="{{ sw_textfile_dir }}/sw_reboot_required.prom"
          tmp="${out}.$$"
          val=0
          if command -v needs-restarting >/dev/null 2>&1; then
            if ! needs-restarting -r >/dev/null 2>&1; then
              val=1
            fi
          fi
          {
            printf '# HELP sw_reboot_required 1 if the host needs a reboot to apply staged updates.\n'
            printf '# TYPE sw_reboot_required gauge\n'
            printf 'sw_reboot_required %d\n' "$val"
          } > "$tmp"
          chmod 0644 "$tmp"
          mv "$tmp" "$out"

    - name: Drop reboot-required systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/sw-reboot-required.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=System Wrangler reboot-required textfile collector
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart={{ sw_reboot_script }}

    - name: Drop reboot-required systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/sw-reboot-required.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run System Wrangler reboot-required collector every minute

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=1min
          AccuracySec=15s
          Unit=sw-reboot-required.service

          [Install]
          WantedBy=timers.target

    - name: Ensure node_exporter systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/node_exporter.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop systemd override forcing 127.0.0.1 bind and textfile collector
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/node_exporter {{ sw_node_exporter_options }}

    - name: Reload systemd to pick up new units and overrides
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        enabled: true

    - name: Enable and start reboot-required timer
      ansible.builtin.systemd:
        name: sw-reboot-required.timer
        state: started
        enabled: true

    - name: Run the reboot-required collector once so the metric exists immediately
      ansible.builtin.command: "{{ sw_reboot_script }}"
      changed_when: false

    - name: Probe node_exporter service state
      ansible.builtin.command: systemctl is-active node_exporter
      register: sw_exporter_active
      changed_when: false
      failed_when: false

    - name: Surface exporter port
      ansible.builtin.debug:
        msg: "SW_EXPORTER_PORT: 9100"

    - name: Surface exporter service name
      ansible.builtin.debug:
        msg: "SW_EXPORTER_SERVICE: node_exporter.service"

    - name: Surface exporter state
      ansible.builtin.debug:
        msg: "SW_EXPORTER_STATE: {{ 'running' if sw_exporter_active.stdout | trim == 'active' else 'failed' }}"
