- name: Install node_exporter (pacman / localhost mode)
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_node_exporter_options: --web.listen-address=127.0.0.1:9100
  tasks:
    - name: Refresh pacman package databases  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pacman -Sy --noconfirm
      changed_when: false

    - name: Install prometheus-node-exporter package  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pacman -S --needed --noconfirm prometheus-node-exporter
      register: pacman_install
      changed_when: pacman_install.stdout is search('installing prometheus-node-exporter', multiline=True)

    - name: Ensure node_exporter systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop systemd override forcing 127.0.0.1 bind
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/prometheus-node-exporter {{ sw_node_exporter_options }}

    - name: Reload systemd to pick up new overrides
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start prometheus-node-exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted
        enabled: true

    - name: Probe service state  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active prometheus-node-exporter
      register: sw_exporter_active
      changed_when: false
      failed_when: false

    - name: Surface exporter port
      ansible.builtin.debug:
        msg: "SW_EXPORTER_PORT: 9100"

    - name: Surface exporter service name
      ansible.builtin.debug:
        msg: "SW_EXPORTER_SERVICE: prometheus-node-exporter.service"

    - name: Surface exporter state
      ansible.builtin.debug:
        msg: "SW_EXPORTER_STATE: {{ 'running' if sw_exporter_active.stdout | trim == 'active' else 'failed' }}"
