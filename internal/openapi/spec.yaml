openapi: 3.1.0
info:
  title: System Wrangler API
  version: v1
  description: |
    HTTP API exposed by the System Wrangler backend. Every protected
    endpoint requires the `sw_session` cookie issued by
    `POST /api/auth/login` (or `POST /api/auth/setup` on a fresh
    install). State-changing requests must also carry the
    `X-Sw-Csrf: 1` header — the CSRF middleware rejects authenticated
    POST/PUT/PATCH/DELETE without it.

    This spec is the source of truth for the API surface. A drift test
    (`cmd/server/openapi_drift_test.go`) compares it to the routes
    registered on the production mux so the two cannot rot apart.

servers:
  - url: /
    description: Same-origin (the SPA and the API share the host).

tags:
  - name: meta
    description: Health, OpenAPI spec, docs.
  - name: auth
    description: Setup, login, logout, profile, password.
  - name: totp
    description: Two-factor authentication and trusted devices.
  - name: users
    description: Admin user management.
  - name: audit
    description: Read-side audit log.
  - name: rbac
    description: Role assignments (global and group-scoped).
  - name: systems
    description: Managed hosts in the fleet.
  - name: groups
    description: Named collections of systems.
  - name: labels
    description: N:M key/value selectors attached to systems. Filter-only — no override semantics or RBAC implications, unlike groups.
  - name: credentials
    description: Ansible authentication slots (global / group / system) and the resolved view.
  - name: hostkeys
    description: SSH host-key acceptance for managed systems (TOFU with operator prompt).
  - name: ansible
    description: Operator-facing ansible affordances — connectivity testing today, ad-hoc actions later.
  - name: updaters
    description: Pluggable per-OS updater substrate. Inspect, check, apply against managed systems; custom playbooks managed by Global Admin.
  - name: exclusions
    description: Per-scope package exclusion rules (global / group / system). Resolved as a union at apply time and threaded into each apply.yml as `sw_excluded_packages`.
  - name: exporters
    description: Pluggable Prometheus exporter substrate. Install, status, remove the per-OS node_exporter / windows_exporter on managed systems; custom installers managed by Global Admin.
  - name: metrics
    description: Authenticated thin proxies to the sibling Prometheus container. Forward PromQL queries to the TSDB; response shape is Prometheus's HTTP API verbatim.
  - name: backup
    description: Database snapshot download.
  - name: secrets
    description: Operator-facing secret scan.
  - name: events
    description: Server-sent events stream.

security:
  - sessionCookie: []

paths:

  /api/health:
    get:
      tags: [meta]
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /api/openapi.yaml:
    get:
      tags: [meta]
      summary: This OpenAPI spec.
      security: []
      responses:
        "200":
          description: The hand-written spec served verbatim.
          content:
            application/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags: [meta]
      summary: Redoc page rendering the OpenAPI spec.
      security: []
      responses:
        "200":
          description: HTML page that loads Redoc and points at /api/openapi.yaml.
          content:
            text/html:
              schema:
                type: string

  /api/auth/status:
    get:
      tags: [auth]
      summary: First-paint status used by the SPA to decide between setup, login, and dashboard.
      security: []
      responses:
        "200":
          description: Setup state + (when a valid session cookie is present) the resolved user.
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired, authenticated]
                properties:
                  setupRequired:
                    type: boolean
                  authenticated:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"

  /api/auth/setup:
    post:
      tags: [auth]
      summary: First-time install bootstrap (only succeeds when no users exist).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Initial user created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Setup already complete (users exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags: [auth]
      summary: "Password login. Returns `{totpRequired: true}` when a second factor is needed."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: "Either the resolved user (login complete) or `{totpRequired: true}`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    required: [totpRequired]
                    properties:
                      totpRequired: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid credentials, or password correct on a disabled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          description: |
            Account is locked. Returned only when the password was
            correct — the wrong-password branch on a locked account
            stays opaque (401) to avoid disclosure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLocked"
        "429":
          description: Per-IP login throttle exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the next attempt is allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie. Idempotent.
      security: []
      responses:
        "204": { description: Logged out. }

  /api/auth/profile:
    patch:
      tags: [auth]
      summary: Update the caller's email and/or theme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                theme:
                  type: string
                  enum: ["", "light", "dark"]
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/password:
    post:
      tags: [auth]
      summary: Change the caller's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "204": { description: Password rotated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Current password incorrect, or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/totp/verify:
    post:
      tags: [totp]
      summary: |
        Second-factor step. Consumes the challenge cookie issued by
        /api/auth/login when TOTP is enabled. Accepts either a TOTP
        code or a one-shot recovery code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                rememberDevice: { type: boolean }
      responses:
        "200":
          description: Login complete; session cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid challenge, wrong code, disabled account, or no challenge cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          description: Correct code on a locked account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLocked"
        "429":
          description: Per-IP throttle exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: TOTP not configured (vault or stores missing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/totp/setup:
    post:
      tags: [totp]
      summary: Begin TOTP enrollment — server returns a pending secret + QR.
      responses:
        "200":
          description: Pending secret, otpauth URI, and base64-encoded QR PNG.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, qrPng]
                properties:
                  secret: { type: string, description: Base32-encoded TOTP secret. }
                  uri: { type: string, description: otpauth:// URI for QR encoding. }
                  qrPng: { type: string, description: Base64-encoded PNG of the QR code. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: TOTP not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/totp/confirm:
    post:
      tags: [totp]
      summary: Confirm pending TOTP enrollment with a code; receive recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: TOTP activated; one-time recovery codes returned.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: No session, or code did not verify.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Pending secret cannot be decrypted with the current master key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: TOTP not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/totp:
    delete:
      tags: [totp]
      summary: Disable TOTP for the caller (requires password + current code).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "204": { description: TOTP disabled and trusted-device rows wiped. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: TOTP secret cannot be decrypted; ask an admin to reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: TOTP not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/devices:
    get:
      tags: [totp]
      summary: List trusted devices for the caller.
      responses:
        "200":
          description: Caller's trusted-device rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedDevice"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/devices/{id}:
    delete:
      tags: [totp]
      summary: Revoke one of the caller's trusted devices.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Device revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Trusted-device store not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users:
    get:
      tags: [users]
      summary: List every user account.
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [users]
      summary: Create a user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created. The user starts with zero role assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users/{id}:
    patch:
      tags: [users]
      summary: Update an account (currently `disabled` only).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Delete an account.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: User deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/users/{id}/password:
    post:
      tags: [users]
      summary: Admin password reset (sets `mustChangePassword` on the target).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "204": { description: Password reset. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/users/{id}/totp/reset:
    post:
      tags: [users]
      summary: Admin-reset TOTP for a user (disables 2FA and wipes trusted devices).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: 2FA disabled on the target account. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/audit:
    get:
      tags: [audit]
      summary: Page through audit-log rows.
      parameters:
        - { in: query, name: actor_id, schema: { type: string } }
        - { in: query, name: actor_label, schema: { type: string }, description: "Case-insensitive substring match." }
        - { in: query, name: action, schema: { type: string }, description: "Exact match, or prefix when trailing '*'." }
        - { in: query, name: target_kind, schema: { type: string } }
        - { in: query, name: target_id, schema: { type: string } }
        - { in: query, name: target_label, schema: { type: string }, description: "Case-insensitive substring match." }
        - { in: query, name: outcome, schema: { type: string, enum: [success, failure, denied] } }
        - { in: query, name: request_id, schema: { type: string } }
        - { in: query, name: since, schema: { type: integer }, description: "Integer milliseconds since epoch." }
        - { in: query, name: until, schema: { type: integer }, description: "Integer milliseconds since epoch." }
        - { in: query, name: limit, schema: { type: integer, minimum: 1 } }
        - { in: query, name: after_ms, schema: { type: integer }, description: "Keyset cursor; pair with after_id." }
        - { in: query, name: after_id, schema: { type: string }, description: "Keyset cursor; pair with after_ms." }
      responses:
        "200":
          description: A page of audit records, optionally with a `next` cursor.
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditRecord"
                  next:
                    type: object
                    required: [afterMs, afterId]
                    properties:
                      afterMs: { type: integer }
                      afterId: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [audit]
      summary: Delete audit rows.
      description: |
        Global Admin only. With no query parameters, truncates the
        entire audit_log. With `older_than_days=N`, drops rows older
        than N days from now. After the delete, a single
        `audit.clear` row is appended carrying `rows_deleted` (and
        `older_than_days` when set) so the action stays attributable
        in the surviving log; that marker is not counted in
        `rowsDeleted`.
      parameters:
        - in: query
          name: older_than_days
          required: false
          schema: { type: integer, minimum: 1, maximum: 3650 }
          description: When set, deletes only rows older than N days.
      responses:
        "200":
          description: Rows deleted.
          content:
            application/json:
              schema:
                type: object
                required: [rowsDeleted]
                properties:
                  rowsDeleted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/audit/{id}:
    get:
      tags: [audit]
      summary: One audit record by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The matching audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecord"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/role-assignments:
    get:
      tags: [rbac]
      summary: List every role assignment. Global Admin only.
      responses:
        "200":
          description: All role assignments, with hydrated username and group name.
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleAssignment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rbac]
      summary: Grant a global or group-scoped role. Global Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "201":
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [rbac]
      summary: Revoke a global or group-scoped role. Global Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "204": { description: Assignment revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/groups/{id}/role-assignments:
    get:
      tags: [rbac]
      summary: List role assignments on one group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assignments scoped to this group.
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleAssignment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [rbac]
      summary: Grant a role on one group. Global Admin or Group Admin of this group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/groups/{id}/role-assignments/{userId}/{role}:
    delete:
      tags: [rbac]
      summary: Revoke a role on one group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: userId, required: true, schema: { type: string } }
        - { in: path, name: role, required: true, schema: { $ref: "#/components/schemas/Role" } }
      responses:
        "204": { description: Assignment revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/me/scope:
    get:
      tags: [rbac]
      summary: Resolved permission set for the caller.
      responses:
        "200":
          description: The caller's global role (if any) and per-group roles.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  global: { $ref: "#/components/schemas/Role" }
                  groups:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/Role"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/systems:
    get:
      tags: [systems]
      summary: List systems visible to the caller's scope.
      parameters:
        - in: query
          name: labels
          required: false
          schema: { type: string }
          description: |
            Optional k8s-subset label selector. When set, the response is
            restricted to systems whose labels satisfy every comma-joined
            requirement (`env=prod,role!=cache,!owner` etc). See the
            Label schema description for the grammar.
      responses:
        "200":
          description: Systems the caller can see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/System"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [systems]
      summary: Register a new system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemInput"
      responses:
        "201":
          description: Created system. `Location` carries `/api/systems/{id}`.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/systems/{id}:
    get:
      tags: [systems]
      summary: One system by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The matching system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not found, or hidden from the caller's scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [systems]
      summary: Remove a system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: System removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/bulk-event:
    post:
      tags: [systems]
      summary: Record a bulk operate-on-selector intent in the audit log.
      description: |
        Writes one parent audit row capturing the operator's intent to
        fan an action out across N systems. The actual updater runs
        still happen through the per-system endpoints — this is the
        record the audit reader uses to spot fleet-wide events without
        scanning every child row. No RBAC gate beyond authentication;
        each per-system action still enforces its own permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, systemIds]
              properties:
                action:
                  type: string
                  enum: [check, apply]
                selector:
                  type: string
                  description: Optional `?labels=` selector text that produced the target set.
                systemIds:
                  type: array
                  items: { type: string }
                  description: System IDs the SPA is about to fan against.
                skipped:
                  type: array
                  description: Systems excluded client-side with the reason (no operator permission, marked unreachable, ...).
                  items:
                    type: object
                    required: [systemId, reason]
                    properties:
                      systemId: { type: string }
                      reason: { type: string }
      responses:
        "204": { description: Audit row written. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/systems/{id}/platform:
    put:
      tags: [systems]
      summary: Set the operator-declared platform flag (Windows vs Unix-like).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isWindows]
              properties:
                isWindows:
                  type: boolean
                  description: True to treat the host as Windows.
      responses:
        "204": { description: Platform flag updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/group:
    put:
      tags: [groups]
      summary: Set or clear a system's group membership.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: [string, "null"]
                  description: Target group, or `null` to clear.
      responses:
        "204": { description: Membership updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/label-styles:
    get:
      tags: [labels]
      summary: Global label color overrides keyed by label key.
      description: |
        Returns the hybrid color model's user-set override layer. The
        SPA falls back to a deterministic hash of the label key for any
        key not present in this map, so callers always have a color.
      responses:
        "200":
          description: Map of label key → color.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  enum: [blue, teal, green, orange, purple, red, orangered, grey, yellow]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/label-styles/{key}:
    put:
      tags: [labels]
      summary: Set or replace the color override for a label key.
      description: Global Admin only — color is a fleet-wide visual setting.
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color:
                  type: string
                  enum: [blue, teal, green, orange, purple, red, orangered, grey, yellow]
      responses:
        "200":
          description: The applied style.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelStyle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [labels]
      summary: Remove the color override for a label key, reverting to the hash default.
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
      responses:
        "204": { description: Override removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/labels:
    get:
      tags: [labels]
      summary: Distinct label keys with per-value cardinalities.
      description: |
        Drives the filter-bar autocomplete and the labels-overview UI.
        Each entry counts how many systems carry that key (across all
        values), with a breakdown by value. Bare tags surface as
        ValueSummary entries with `value: null`.
      responses:
        "200":
          description: Label key summary, ordered by key ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabelKeySummary"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/systems/{id}/labels:
    get:
      tags: [labels]
      summary: List the labels attached to a system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Labels on the system, ordered by key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: System not found or hidden from the caller's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/systems/{id}/labels/{key}:
    put:
      tags: [labels]
      summary: Set or update a single label on a system.
      description: |
        Body carries the value. Send `{"value": null}` for a bare tag.
        Reserved-prefix keys (`system-wrangler.io/…`) are rejected with
        403 — those slots are owned by System Wrangler itself.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelInput" }
      responses:
        "200":
          description: The applied label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [labels]
      summary: Remove a label key from a system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
      responses:
        "204": { description: Label removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/groups:
    get:
      tags: [groups]
      summary: List groups visible to the caller.
      responses:
        "200":
          description: Groups the caller can see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [groups]
      summary: Create a group. Global Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group created. `Location` carries `/api/groups/{id}`.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/groups/{id}:
    get:
      tags: [groups]
      summary: One group by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The matching group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not found, or hidden from the caller's scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [groups]
      summary: Rename a group. Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Renamed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [groups]
      summary: Delete a group. Systems become ungrouped.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Group deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/ansible-credentials:
    get:
      tags: [credentials]
      summary: List every ansible credential slot. Global Admin only.
      responses:
        "200":
          description: All configured slots (global, group, system).
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/CredentialSlot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/ansible-credentials/global:
    get:
      tags: [credentials]
      summary: Get the global credential slot.
      responses:
        "200":
          description: The global slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [credentials]
      summary: Set or replace the global credential slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpsert"
      responses:
        "200":
          description: Updated slot. The private key blob is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Secrets vault not configured; cannot seal a new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [credentials]
      summary: Delete the global credential slot.
      responses:
        "204": { description: Slot deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/groups/{id}/ansible-credential:
    get:
      tags: [credentials]
      summary: Get the credential slot for one group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The group's slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [credentials]
      summary: Set or replace the credential slot for one group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpsert"
      responses:
        "200":
          description: Updated slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [credentials]
      summary: Delete the group's credential slot.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Slot deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/ansible-credential:
    get:
      tags: [credentials]
      summary: Get the credential slot scoped to one system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The system's slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [credentials]
      summary: Set or replace the credential slot for one system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpsert"
      responses:
        "200":
          description: Updated slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialSlot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [credentials]
      summary: Delete the system's credential slot.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Slot deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/effective-credential:
    get:
      tags: [credentials]
      summary: Resolve the effective ansible credential for one system.
      description: |
        Walks system → group → global per field. The response records
        which slot supplied each field so the UI can surface
        "inherited from group X" badges.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resolved credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveCredential"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: System not found, hidden from scope, or no credentials configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slot configuration is incomplete (user or key missing at every level).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/host-keys:
    get:
      tags: [hostkeys]
      summary: List a system's accepted and pending SSH host keys.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Every host-key row for the system, accepted rows first.
          content:
            application/json:
              schema:
                type: object
                required: [hostKeys]
                properties:
                  hostKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostKey"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/test-connection:
    post:
      tags: [ansible]
      summary: Run `ansible <host> -m ping` against the system.
      description: |
        End-to-end connectivity probe. Resolves the credential
        slot, materializes per-run private key + known_hosts +
        inventory, invokes `ansible` ad-hoc with `-m ping`, and
        reports whether the module returned `pong`. Emits one
        `system.connection.test` audit row. Disabled (503) when
        the server has no vault configured.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            The probe completed. `status` is the verdict:
            `success` (pong returned), `failure`,
            `host_key_mismatch`, `no_accepted_host_key`, or
            `missing_credentials`.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason, exitCode, durationMs]
                properties:
                  status:
                    type: string
                    enum: [success, failure, host_key_mismatch, no_accepted_host_key, missing_credentials]
                  reason: { type: string }
                  exitCode: { type: integer }
                  durationMs: { type: integer }
                  details:
                    type: string
                    description: |
                      Diagnostic blurb extracted from stdout/stderr on
                      failure — typically the trailing "fatal: ...
                      FAILED!" lines including the module's stderr.
                      Empty on success. Capped server-side; full
                      transcripts only land in the audit log.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/host-keys/scan:
    post:
      tags: [hostkeys]
      summary: Run ssh-keyscan against the system and record offered keys as pending.
      description: |
        Operator-facing affordance for "I just added this system;
        capture its host keys now without waiting for an ansible
        run." Each offered key is upserted into the pending slot
        for its algorithm and emits a `system.host_key.pending`
        audit row. Returns the captured rows.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: The captured host-key rows (with store-assigned ids).
          content:
            application/json:
              schema:
                type: object
                required: [hostKeys]
                properties:
                  hostKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostKey"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: ssh-keyscan could not reach the host or produced no parseable output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Scan endpoint disabled (executor not configured on this server).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/host-keys/accept:
    post:
      tags: [hostkeys]
      summary: Promote a pending host key to accepted.
      description: |
        Body carries `{algorithm, fingerprint}`. The fingerprint
        must match the current pending row's fingerprint — defeats
        stale-banner accepts where the operator was looking at an
        older offered key. If an accepted row already exists for
        the same algorithm it is replaced atomically, and the
        emitted audit row is `system.host_key.replace` (otherwise
        `system.host_key.accept`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [algorithm, fingerprint]
              properties:
                algorithm: { type: string }
                fingerprint: { type: string }
      responses:
        "200":
          description: The promoted host-key row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostKey"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System not found, or no pending host key for this algorithm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Fingerprint does not match the current pending row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/host-keys/{keyId}:
    delete:
      tags: [hostkeys]
      summary: Reject a pending host key, or delete an accepted one.
      description: |
        DELETE on a pending row emits `system.host_key.reject` and
        is the operator's "no, that's not the key I expected" path.
        DELETE on an accepted row emits `system.host_key.delete`
        and is used before re-enrolling a system that's been
        reinstalled.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: keyId, required: true, schema: { type: string } }
      responses:
        "204": { description: Host-key row deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/inspect:
    post:
      tags: [updaters]
      summary: Probe the system for installed updaters and reconcile system_updaters.
      description: |
        Composes a one-shot detection playbook from the registry
        (one `command -v <binary>` task per updater), runs it, and
        upserts/removes `system_updaters` rows based on what the
        target reported. Emits a `system.inspect.start` /
        `system.inspect.complete` audit pair. Returns 409 with the
        conflicting run id when another inspect / check / apply is
        in flight on the same system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Inspection completed. `detected` is the resolved availability list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another run is in progress for this system; the response carries the conflicting run id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/updaters/{updater}/check:
    post:
      tags: [updaters]
      summary: Run the named updater's check playbook against the system.
      description: |
        Fires the read-only check playbook (e.g. `dnf list updates`).
        Emits `system.update.check.start` / `.complete`. The
        complete row's detail carries `affected_packages` (the
        SW_AFFECTED_COUNT marker the playbook surfaced) and
        `log_sha`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: updater, required: true, schema: { type: string } }
      responses:
        "200":
          description: Check completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterRunResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or updater not found (or the updater is soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another run is in progress for this system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/updaters/{updater}/apply:
    post:
      tags: [updaters]
      summary: Run the named updater's apply playbook against the system.
      description: |
        Fires the mutating apply playbook (e.g. `dnf upgrade *`).
        Emits `system.update.apply.start` / `.complete`. Apply
        completes with `affected_packages` and `log_sha` in
        `detail`, mirroring the check shape.

        Optional JSON body narrows the apply to specific package
        names: `{"packages": ["openssl", "openssl-libs"]}`. Each
        builtin's apply playbook reads `sw_targeted_packages` and
        composes the manager-native command (e.g. `dnf upgrade
        openssl openssl-libs`). Empty body or omitted `packages`
        upgrades everything pending — the legacy behaviour.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: updater, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                packages:
                  type: array
                  items: { type: string, minLength: 1 }
                  description: |
                    Package names to upgrade. Empty / omitted means
                    "every pending update on this updater."
      responses:
        "200":
          description: Apply completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterRunResult"
        "400":
          description: Malformed body (e.g. `packages` contains an empty entry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or updater not found (or the updater is soft-deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another run is in progress for this system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/updaters:
    get:
      tags: [updaters]
      summary: Per-system updater list — every registered updater × this system's detection and enablement state.
      description: |
        Drives the system detail page's "Enabled updaters" card.
        Each entry pairs a registered updater (builtin or custom)
        with whether the last inspection detected it on this host
        (`installed`) and whether the operator has it enabled
        (`enabled`). Non-installed rows render as
        `installed=false, enabled=false`; enablement only matters
        once detection confirms the binary is present.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Per-system updater rows.
          content:
            application/json:
              schema:
                type: object
                required: [updaters]
                properties:
                  updaters:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemUpdater"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/updaters/{updater}/enabled:
    put:
      tags: [updaters]
      summary: Toggle whether fan-out check/apply fires this updater on this system.
      description: |
        Operator-on-group only. The (system, updater) row must
        exist — enablement is a flag on a detected updater, not
        a way to register one. Returns 404 if no detection row
        is present.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: updater, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Enabled flag updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System not found, or this updater has not been detected on it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/updater-runs:
    get:
      tags: [updaters]
      summary: Paginated run history for the system, newest first.
      description: |
        Returns the recent inspect / check / apply runs against this
        system. `logTail` is the trailing ~12 KB of ansible output
        captured at finish time; the full stream is not persisted.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent runs for this system.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/UpdaterRun"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/updater-definitions:
    get:
      tags: [updaters]
      summary: List every registered updater (builtins + custom), unioned.
      description: |
        Any authenticated user. Soft-deleted custom definitions are
        omitted. Builtins are code-registered and always present;
        custom rows are pulled from `updater_definitions`.
      responses:
        "200":
          description: The union of registered updaters.
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UpdaterDefinition"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [updaters]
      summary: Create a custom updater. Global Admin only.
      description: |
        Save-time guards: input validation (display_name,
        detect_binary, both playbook bodies non-empty, 64 KB cap),
        inline-credential heuristic (rejects `password:`,
        `token:`, `secret:` keys), and `ansible-playbook
        --syntax-check`. Emits `updater.create` with the playbook
        SHAs in detail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdaterDefinitionInput"
      responses:
        "201":
          description: Custom updater created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterDefinition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An updater with this id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/updater-definitions/{id}:
    patch:
      tags: [updaters]
      summary: Replace a custom updater's editable fields. Global Admin only.
      description: |
        Re-runs every save-time guard. Builtins are rejected; ids
        that don't begin with `custom.` are rejected. Emits
        `updater.update`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdaterDefinitionPatch"
      responses:
        "200":
          description: Updated custom updater.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterDefinition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [updaters]
      summary: Soft-delete a custom updater. Global Admin only.
      description: |
        Stamps `deleted_at`; historical `updater_runs` and audit
        rows still resolve the original display name. Emits
        `updater.delete`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Custom updater soft-deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/exporters:
    get:
      tags: [exporters]
      summary: Per-system exporter list — every registered installer × this system's availability and install state.
      description: |
        Drives the system detail page's Monitoring tab. Each entry
        pairs a registered installer (builtin or custom) with the
        three-state availability ("available" / "unavailable" /
        "unknown"), the install state, and the most recently observed
        port + service name + reason. The response also carries the
        per-system scrape mode and the list of detected package
        managers (the updater ids the inspection last reported as
        installed), so the SPA can offer "Add a custom installer"
        targeted at the right package manager when nothing matches.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Per-system exporter rows plus scrape mode and detected pkg managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemExportersResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/exporters/{exporter}/install:
    post:
      tags: [exporters]
      summary: Run the named installer's install.yml against the system.
      description: |
        Installs the exporter (e.g. `node_exporter` via dnf), drops
        the textfile collector + reboot-required emitter, and
        enables the service. Emits
        `system.exporter.install.start` / `.complete`. Returns 409
        with the conflicting run id when another exporter or
        updater run is in flight on the same system — both
        substrates share the same per-host lock.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exporter, required: true, schema: { type: string } }
      responses:
        "200":
          description: Install completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExporterRunResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or installer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another inspect/check/apply/install/status/remove is in progress for this system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/exporters/{exporter}/status:
    post:
      tags: [exporters]
      summary: Re-probe the exporter and refresh the system_exporters row.
      description: |
        Runs the installer's status.yml — the lighter-weight
        "Inspect now" equivalent. Emits
        `system.exporter.status.start` / `.complete`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exporter, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status probe completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExporterRunResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or installer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another run is in progress for this system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/exporters/{exporter}/remove:
    post:
      tags: [exporters]
      summary: Run the installer's remove.yml and mark the row as removed.
      description: |
        Refuses with 400 when the installer does not declare a
        remove playbook. On success, the system_exporters row is
        transitioned to `state=removed`. Emits
        `system.exporter.remove.start` / `.complete`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exporter, required: true, schema: { type: string } }
      responses:
        "200":
          description: Remove completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExporterRunResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or installer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another run is in progress for this system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdaterConflict"
        "503":
          description: Runner not configured on this server (no vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/exporters/{exporter}/scrape:
    put:
      tags: [exporters]
      summary: Pause or resume Prometheus scraping for an installed exporter.
      description: |
        Flips `scrape_enabled` on the (system, exporter) row.
        Prometheus's targets.json filters by this flag so a paused
        entry stops being scraped without uninstalling the exporter
        on the host. Idempotent: setting an already-current value
        returns 200 without emitting an audit event. On actual
        change, emits `system.exporter.scrape.enable` or
        `system.exporter.scrape.disable` and broadcasts
        `systems.changed`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exporter, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Current scrape state for the row.
          content:
            application/json:
              schema:
                type: object
                required: [exporterId, scrapeEnabled]
                properties:
                  exporterId: { type: string }
                  scrapeEnabled: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: System or exporter row not found (exporter is not installed on this system).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/systems/{id}/exporter-settings:
    put:
      tags: [exporters]
      summary: Set the per-system scrape mode.
      description: |
        Phase 1 only accepts `localhost`. `mtls-self` and
        `mtls-byo` are reserved for future phases — the schema
        accepts them so a later release can land them additively,
        but the handler refuses them today.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scrapeMode]
              properties:
                scrapeMode:
                  $ref: "#/components/schemas/ExporterScrapeMode"
      responses:
        "204": { description: Scrape mode updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/exporter-runs:
    get:
      tags: [exporters]
      summary: Paginated exporter run history for the system, newest first.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Recent exporter runs for this system.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExporterRun"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/exporter-definitions:
    get:
      tags: [exporters]
      summary: List every registered exporter installer (builtins + custom), unioned.
      responses:
        "200":
          description: The union of registered installers.
          content:
            application/json:
              schema:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExporterDefinition"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [exporters]
      summary: Create a custom installer. Global Admin only.
      description: |
        Save-time guards: input validation (display_name +
        applies_to_pkg_manager + exporter_kind + bind_port +
        install + status playbook bodies non-empty, 64 KB cap
        each), inline-credential heuristic, `ansible-playbook
        --syntax-check`. Emits `exporter.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExporterDefinitionInput"
      responses:
        "201":
          description: Custom installer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExporterDefinition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An installer with this id already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/exporter-definitions/{id}:
    patch:
      tags: [exporters]
      summary: Replace a custom installer's editable fields. Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExporterDefinitionPatch"
      responses:
        "200":
          description: Updated custom installer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExporterDefinition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [exporters]
      summary: Soft-delete a custom installer. Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Custom installer soft-deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/backup:
    post:
      tags: [backup]
      summary: Stream a SQLite snapshot of the database. Global Admin only.
      responses:
        "200":
          description: The snapshot file streamed back with a timestamped filename.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Another backup is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/package-exclusions:
    get:
      tags: [exclusions]
      summary: List fleet-wide (global-scope) package exclusions.
      responses:
        "200":
          description: Global-scope rows ordered by created_at.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exclusion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [exclusions]
      summary: Create a fleet-wide exclusion. Global Admin only.
      description: |
        Updater must be `*` (every updater on this scope) or
        `builtin.<name>` / `custom.<name>`. Pattern is verbatim — each
        updater's apply.yml uses it in its native syntax. Emits
        `package_exclusion.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionInput" }
      responses:
        "201":
          description: Exclusion created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exclusion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An identical (scope, target, updater, pattern) row already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/admin/package-exclusions/{id}:
    delete:
      tags: [exclusions]
      summary: Remove a fleet-wide exclusion. Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Exclusion removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/groups/{id}/package-exclusions:
    get:
      tags: [exclusions]
      summary: List group-scope exclusions for one group.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Group-scope rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exclusion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [exclusions]
      summary: Create a group-scope exclusion. Group Admin / Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionInput" }
      responses:
        "201":
          description: Exclusion created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exclusion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An identical (scope, target, updater, pattern) row already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/groups/{id}/package-exclusions/{exclusionId}:
    delete:
      tags: [exclusions]
      summary: Remove a group-scope exclusion. Group Admin / Global Admin only.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exclusionId, required: true, schema: { type: string } }
      responses:
        "204": { description: Exclusion removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/systems/{id}/package-exclusions:
    get:
      tags: [exclusions]
      summary: List system-scope exclusions for one system.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: System-scope rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exclusion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [exclusions]
      summary: Create a system-scope exclusion. Group Operator+ on the system's group / Global Operator+.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionInput" }
      responses:
        "201":
          description: Exclusion created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exclusion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An identical (scope, target, updater, pattern) row already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/systems/{id}/package-exclusions/{exclusionId}:
    delete:
      tags: [exclusions]
      summary: Remove a system-scope exclusion. Group Operator+ / Global Operator+.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: exclusionId, required: true, schema: { type: string } }
      responses:
        "204": { description: Exclusion removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/systems/{id}/package-exclusions/effective:
    get:
      tags: [exclusions]
      summary: Resolve the unioned exclusion set for one system + updater.
      description: |
        Returns the global + group + system rows that match the given
        updater. Used by the System Detail "what will be skipped"
        card. Each row keeps its source scope so the SPA can attribute
        attribution.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: query
          name: updater
          required: true
          schema: { type: string }
          description: Registered updater id (`builtin.<name>` / `custom.<name>`). The `*` sentinel from rule rows is matched server-side.
      responses:
        "200":
          description: Resolved union; global rows first, then group, then system.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exclusion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/secrets/undecryptable:
    get:
      tags: [secrets]
      summary: List sealed rows that cannot be opened with the current master key. Global Admin only.
      responses:
        "200":
          description: Undecryptable rows aggregated across every Source.
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, field, targetId, targetLabel, keyVersion]
                      properties:
                        kind: { type: string }
                        field: { type: string }
                        targetId: { type: string }
                        targetLabel: { type: string }
                        keyVersion: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/settings:
    get:
      tags: [settings]
      summary: List instance-wide settings. Global Admin only.
      description: |
        Returns the full set of known settings as a `{key: value}` map.
        Unset known keys are filled in with their default so the SPA
        always sees the value that's in effect.
      responses:
        "200":
          description: The current set of settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: object
                    additionalProperties: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/settings/{key}:
    put:
      tags: [settings]
      summary: Set a single setting by key. Global Admin only.
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        "204": { description: Setting stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown setting key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/metrics/query:
    get:
      tags: [metrics]
      summary: Forward an instant PromQL query to the sibling Prometheus.
      description: |
        Thin authenticated proxy. Query parameters are forwarded
        verbatim — `query` is required; `time` (Unix epoch seconds)
        is optional. The response body is Prometheus's HTTP API
        JSON unchanged, so clients can deserialize against the
        Prometheus contract directly.
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
          description: PromQL expression.
        - in: query
          name: time
          required: false
          schema: { type: number }
          description: Evaluation timestamp (Unix epoch seconds). Defaults to "now" on the server.
      responses:
        "200":
          description: Prometheus HTTP API response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Upstream Prometheus error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Metrics pipeline not configured.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "504":
          description: Upstream Prometheus timed out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [metrics]
      summary: Forward an instant PromQL query (form-encoded body) to Prometheus.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: Prometheus HTTP API response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Upstream Prometheus error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Metrics pipeline not configured.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/metrics/query_range:
    get:
      tags: [metrics]
      summary: Forward a range PromQL query to the sibling Prometheus.
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
        - in: query
          name: start
          required: true
          schema: { type: number }
          description: Start of the range, Unix epoch seconds.
        - in: query
          name: end
          required: true
          schema: { type: number }
          description: End of the range, Unix epoch seconds.
        - in: query
          name: step
          required: true
          schema: { type: number }
          description: Resolution in seconds.
      responses:
        "200":
          description: Prometheus HTTP API range response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Upstream Prometheus error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Metrics pipeline not configured.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "504":
          description: Upstream Prometheus timed out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [metrics]
      summary: Forward a range PromQL query (form-encoded body) to Prometheus.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: Prometheus HTTP API range response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Upstream Prometheus error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Metrics pipeline not configured.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/events:
    get:
      tags: [events]
      summary: Subscribe to the server-sent events stream of fleet changes.
      responses:
        "200":
          description: |
            SSE stream. The body is a sequence of `data: <json>\n\n`
            lines plus periodic `: keepalive\n\n` comments.
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sw_session

  responses:
    BadRequest:
      description: Request payload rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but the scope forbids this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist (or is hidden from the caller's scope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with existing state (duplicate or precondition failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    AccountLocked:
      type: object
      required: [error, lockedUntil]
      properties:
        error: { type: string }
        lockedUntil:
          type: string
          format: date-time
          description: RFC3339 timestamp when the lock expires.

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }

    User:
      type: object
      required: [id, username, email, theme, createdAt, totpEnabled, disabled, mustChangePassword]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        theme:
          type: string
          enum: ["", "light", "dark"]
        createdAt: { type: string, format: date-time }
        totpEnabled: { type: boolean }
        disabled: { type: boolean }
        disabledAt: { type: string, format: date-time }
        failedAttempts: { type: integer }
        lockedUntil: { type: string, format: date-time }
        mustChangePassword: { type: boolean }

    TrustedDevice:
      type: object
      required: [id, label, createdAt, lastUsedAt, expiresAt]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    System:
      type: object
      required: [id, name, hostname, createdAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [unprobed, reachable, unreachable]
        lastSeen: { type: string, format: date-time }
        groupId: { type: string }
        lastCheckedAt:
          type: string
          format: date-time
          description: Most recent check run timestamp across every updater on this system. Absent when no check has ever run.
        pendingUpdates:
          type: integer
          description: Cumulative count of pending updates across this system's enabled updaters, from each updater's latest check run. Absent when no check has ever run.
        pendingPackages:
          type: array
          items: { type: string }
          description: De-duplicated union of package names every enabled updater on this system reported pending on its latest check. Empty when no check has produced markers; surfaced for the systems-list hover tooltip without an N+1 round trip.
        lastRunFailed:
          type: boolean
          description: True when the most recent terminated updater run against this system exited non-zero. Drives the red "Needs Attention" glyph on the SPA regardless of probe status.
        lastRunReason:
          type: string
          description: Short operator-readable summary of the last-run failure (e.g. "apply exit 2"). Empty when no run has failed.
        isWindows:
          type: boolean
          description: Operator-declared platform flag. True flips the Ansible inventory to `ansible_shell_type=powershell` and the Ping module to `ansible.windows.win_ping`. Absent / false means the host is treated as Unix-like.
        running:
          type: boolean
          description: True when an updater (inspect / check / apply) is currently in flight against this system. Derived from `updater_run_locks`; lets the SPA keep a row's spinner lit even when the work was started from another tab and persists the indicator across page navigation.
        osFamily:
          type: string
          description: Detected OS family ("Linux", "Darwin", "FreeBSD", "OpenBSD", "NetBSD", "Windows"). Populated by the inspect playbook's `SW_OS_FAMILY:` marker. Absent pre-inspect.
        osDistribution:
          type: string
          description: Detected distribution + version, e.g. "Fedora 41", "macOS 14.6", "Microsoft Windows 11 Pro 10.0.22631". Populated by the inspect playbook's `SW_OS_DISTRIBUTION:` marker.
        virtualization:
          type: string
          description: Lowercased virtualization type detected on the host ("kvm", "vmware", "hyperv", "xen", "virtualbox", "lxc", "parallels", ...). Empty when the host is bare-metal or pre-inspect.
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
          description: |
            Every label currently attached to this system. Inline on the
            list response so SPAs can render chips + click-to-filter
            without an N+1 per-row fetch. Absent / empty when the system
            has no labels set.

    Label:
      type: object
      required: [key]
      description: |
        One (key, value) tag attached to a system. `value` is nullable
        — a `null` value represents a bare tag (existence-only match),
        an empty string is a legal equality target.
      properties:
        key:
          type: string
          description: |
            k8s-subset key. Charset `[a-zA-Z0-9._-]`, optional
            `prefix/` segment; per-segment cap 63, total cap 253.
            The `system-wrangler.io/` prefix is reserved for
            system-set labels and rejected from user input.
        value:
          type: [string, "null"]
          description: |
            Optional value. Same charset as key (minus `/`); cap 63
            chars. `null` means "bare tag, matched by existence."

    LabelInput:
      type: object
      required: [value]
      description: Request body for PUT /api/systems/{id}/labels/{key}.
      properties:
        value:
          type: [string, "null"]
          description: Same shape as Label.value.

    LabelStyle:
      type: object
      required: [key, color]
      description: |
        One row from the global label color override table. The SPA
        composes auto-color (hash) + this override map to render
        chips; setting an override is Global Admin only.
      properties:
        key: { type: string }
        color:
          type: string
          enum: [blue, teal, green, orange, purple, red, orangered, grey, yellow]

    LabelKeySummary:
      type: object
      required: [key, values, count]
      description: One entry from GET /api/labels.
      properties:
        key: { type: string }
        count:
          type: integer
          description: Total systems carrying this key, summing all values + bare-tag bucket.
        values:
          type: array
          description: "Per-value breakdown. A `value: null` entry counts bare tags."
          items:
            type: object
            required: [count]
            properties:
              value: { type: [string, "null"] }
              count: { type: integer }

    SystemInput:
      type: object
      required: [name, hostname]
      properties:
        name: { type: string, maxLength: 255 }
        hostname: { type: string, maxLength: 255 }

    Group:
      type: object
      required: [id, name, createdAt, systemCount]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        systemCount: { type: integer }

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }

    Exclusion:
      type: object
      required: [id, scope, updater, pattern, createdAt, createdBy]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [global, group, system]
        targetId:
          type: string
          description: Group id for group scope, system id for system scope, omitted for global scope.
        updater:
          type: string
          description: Registered updater id or `*` (every updater on this scope).
        pattern:
          type: string
          maxLength: 256
          description: Manager-native package name or glob; verbatim, not normalized.
        reason:
          type: string
          maxLength: 1024
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    ExclusionInput:
      type: object
      required: [updater, pattern]
      properties:
        updater:
          type: string
          description: Registered updater id (`builtin.<name>` / `custom.<name>`) or `*`.
        pattern: { type: string, maxLength: 256 }
        reason: { type: string, maxLength: 1024 }

    Role:
      type: string
      enum: [admin, operator, auditor]

    RoleAssignment:
      type: object
      required: [userId, groupId, role]
      properties:
        userId: { type: string }
        username: { type: string }
        groupId:
          type: [string, "null"]
          description: "`null` for global assignments."
        groupName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    RoleAssignmentInput:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        groupId:
          type: [string, "null"]
          description: Omit (or `null`) for a global assignment.
        role: { $ref: "#/components/schemas/Role" }

    CredentialScopeKind:
      type: string
      enum: [global, group, system]

    CredentialOrigin:
      type: string
      enum: [sw_generated, user_supplied]

    CredentialSlot:
      type: object
      required: [scopeKind, createdAt, updatedAt]
      properties:
        scopeKind: { $ref: "#/components/schemas/CredentialScopeKind" }
        scopeId:
          type: string
          description: Empty for global; group/system UUID otherwise.
        ansibleUser: { type: string }
        publicKey:
          type: string
          description: OpenSSH authorized_keys line. Private key bytes are never returned.
        origin: { $ref: "#/components/schemas/CredentialOrigin" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CredentialKeyInput:
      type: object
      required: [origin]
      properties:
        origin: { $ref: "#/components/schemas/CredentialOrigin" }
        privateKeyPem:
          type: string
          description: |
            Required when origin is `user_supplied`. Ignored when
            origin is `sw_generated` (the server mints a fresh ed25519
            keypair and discards any pasted PEM).

    CredentialUpsert:
      type: object
      description: |
        At least one of `ansibleUser` or `key` (or `clearKey: true`)
        must be set. Fields not present on the request leave the
        existing slot value untouched.
      properties:
        ansibleUser:
          type: string
          description: Set to override or clear (empty string) the slot's ansible user.
        key:
          $ref: "#/components/schemas/CredentialKeyInput"
        clearKey:
          type: boolean
          description: Remove the slot's existing key without supplying a replacement.

    EffectiveCredential:
      type: object
      required: [ansibleUser, userSource, publicKey, keySource, keyOrigin]
      properties:
        ansibleUser: { type: string }
        userSource: { $ref: "#/components/schemas/CredentialScopeKind" }
        publicKey: { type: string }
        keySource: { $ref: "#/components/schemas/CredentialScopeKind" }
        keyOrigin: { $ref: "#/components/schemas/CredentialOrigin" }

    HostKey:
      type: object
      required: [id, systemId, state, algorithm, publicKey, fingerprint, firstSeenAt]
      properties:
        id: { type: string }
        systemId: { type: string }
        state:
          type: string
          enum: [pending, accepted]
        algorithm:
          type: string
          description: "SSH host-key algorithm (e.g. ssh-ed25519, ssh-rsa, ecdsa-sha2-nistp256)."
        publicKey:
          type: string
          description: Authorized_keys-style body of the host key.
        fingerprint:
          type: string
          description: SHA256 fingerprint shown in the UI.
        firstSeenAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        acceptedBy:
          type: string
          description: User id of the operator who clicked Accept. Empty for pending rows.

    UpdaterRunKind:
      type: string
      enum: [inspect, check, apply]

    UpdaterRun:
      type: object
      required: [id, systemId, kind, startedAt]
      properties:
        id: { type: string }
        systemId: { type: string }
        updaterId:
          type: string
          description: Empty when kind is `inspect` (the sweep covers every registered updater at once).
        kind: { $ref: "#/components/schemas/UpdaterRunKind" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        actorId: { type: string }
        playbookSha:
          type: string
          description: Hex SHA-256 of the playbook body that ran.
        logTail:
          type: string
          description: Trailing ~12 KB of ansible stdout/stderr captured at finish time.

    UpdaterRunStatus:
      type: string
      enum: [success, failure, host_key_mismatch, no_accepted_host_key, missing_credentials]

    UpdaterConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        conflictingRun:
          type: string
          description: Run id of the in-flight inspect/check/apply currently holding the per-system lock.

    InspectResult:
      type: object
      required: [runId, status, exitCode, detected, durationMs]
      properties:
        runId: { type: string }
        status: { $ref: "#/components/schemas/UpdaterRunStatus" }
        exitCode: { type: integer }
        reason: { type: string }
        detected:
          type: array
          items: { type: string }
          description: Updater ids the playbook reported as present (sorted).
        removed:
          type: array
          items: { type: string }
          description: Updater ids that were previously recorded but no longer detected.
        durationMs: { type: integer }

    UpdaterDefinition:
      type: object
      required: [id, source, displayName, detectBinary, checkPlaybook, applyPlaybook, checkOnly, supportsExclusions]
      properties:
        id:
          type: string
          description: '`builtin.<name>` or `custom.<slug>`. Prefixes are reserved.'
        source:
          type: string
          enum: [builtin, custom]
        displayName: { type: string }
        description: { type: string }
        detectBinary:
          type: string
          description: Binary name probed via `command -v` during inspection. Charset is restricted to `[A-Za-z0-9._-]{1,64}`.
        checkPlaybook:
          type: string
          description: YAML body of the check playbook (read-only "what's pending").
        applyPlaybook:
          type: string
          description: YAML body of the apply playbook (mutates the host). Empty when checkOnly is true.
        checkOnly:
          type: boolean
          description: When true the updater surfaces pending changes but is never auto-applied; Apply requests return 409. applyPlaybook must be empty.
        supportsExclusions:
          type: boolean
          description: |
            Whether the updater's apply.yml honours the
            `sw_excluded_packages` extra-var. v1 builtins covered are
            dnf, pacman, zypper, pkg (FreeBSD), winget, chocolatey.
            Hold-based managers (apt, brew, snap, flatpak, pkgin,
            xbps, scoop) and builtins with no usable exclude mechanism
            (apk, pkg_add, syspatch, eopkg, mas, softwareupdate,
            windowsupdate, fwupdmgr) report false. Custom updaters
            always report true — the playbook author is the only one
            who can know whether the var is read.
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdaterDefinitionInput:
      type: object
      required: [id, displayName, detectBinary, checkPlaybook, applyPlaybook]
      properties:
        id:
          type: string
          description: Bare slug (`dnf-fast`) or full id (`custom.dnf-fast`). The server prepends `custom.` if absent.
        displayName: { type: string }
        description: { type: string }
        detectBinary: { type: string }
        checkPlaybook:
          type: string
          description: '64 KB cap; must pass `ansible-playbook --syntax-check` and the inline-credential heuristic.'
        applyPlaybook:
          type: string
          description: Empty when checkOnly is true; otherwise required (same caps and gates as checkPlaybook).
        checkOnly:
          type: boolean
          description: Set true to declare a check-only updater. applyPlaybook must then be empty.

    UpdaterDefinitionPatch:
      type: object
      required: [displayName, detectBinary, checkPlaybook, applyPlaybook]
      properties:
        displayName: { type: string }
        description: { type: string }
        detectBinary: { type: string }
        checkPlaybook: { type: string }
        applyPlaybook: { type: string }
        checkOnly: { type: boolean }

    SystemUpdater:
      type: object
      required: [updaterId, source, displayName, installed, enabled, checkOnly, pendingPackages]
      properties:
        updaterId: { type: string }
        source:
          type: string
          enum: [builtin, custom]
        displayName: { type: string }
        installed:
          type: boolean
          description: True when the last inspection found the detect binary on this system.
        enabled:
          type: boolean
          description: Operator's per-system toggle. Fan-out check/apply only fires updaters that are both installed and enabled.
        checkOnly:
          type: boolean
          description: True when the updater is registered check-only; Apply is rejected with 409.
        lastSeenAt:
          type: string
          format: date-time
          description: Timestamp of the inspection that last confirmed the binary present.
        pendingPackages:
          type: array
          items: { type: string }
          description: Package names the most recent check run surfaced via SW_PENDING_PACKAGE markers. Empty for updaters whose check playbook does not emit them or that have never been checked.

    UpdaterRunResult:
      type: object
      required: [runId, updaterId, kind, status, exitCode, affectedCount, durationMs]
      properties:
        runId: { type: string }
        updaterId: { type: string }
        kind: { $ref: "#/components/schemas/UpdaterRunKind" }
        status: { $ref: "#/components/schemas/UpdaterRunStatus" }
        exitCode: { type: integer }
        affectedCount:
          type: integer
          description: SW_AFFECTED_COUNT marker the playbook surfaced; 0 when absent.
        reason: { type: string }
        durationMs: { type: integer }

    AuditRecord:
      type: object
      required: [id, occurredAt, actorKind, action, outcome]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorKind:
          type: string
          enum: [user, system, unauthenticated]
        actorId: { type: string }
        actorLabel: { type: string }
        action: { type: string }
        targetKind: { type: string }
        targetId: { type: string }
        targetLabel: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        detail:
          type: object
          additionalProperties: true
        requestIp: { type: string }
        requestId: { type: string }

    ExporterSource:
      type: string
      enum: [builtin, custom]

    ExporterKind:
      type: string
      enum: [node_exporter, windows_exporter]

    ExporterScrapeMode:
      type: string
      enum: [localhost, mtls-self, mtls-byo]
      description: Per-system transport selection. Phase 1 only accepts localhost; mTLS modes are reserved.

    ExporterState:
      type: string
      enum: [installed, running, failed, removed]

    ExporterAvailability:
      type: string
      enum: [available, unavailable, unknown]

    ExporterRunKind:
      type: string
      enum: [install, status, remove]

    ExporterDefinition:
      type: object
      required: [id, source, displayName, appliesToPkgManager, exporterKind, bindPort, installPlaybook, statusPlaybook, removePlaybook]
      properties:
        id:
          type: string
          description: '`builtin.<name>.exporter` or `custom.<slug>`. Prefixes are reserved.'
        source: { $ref: "#/components/schemas/ExporterSource" }
        displayName: { type: string }
        description: { type: string }
        appliesToPkgManager:
          type: string
          description: The updater id this installer targets (e.g. "builtin.dnf"). Cross-referenced against per-system detected updaters to compute availability.
        exporterKind: { $ref: "#/components/schemas/ExporterKind" }
        bindPort:
          type: integer
          description: Default listen port the installer hands to the exporter binary; the playbook may override and surface a different port via the SW_EXPORTER_PORT marker.
        installPlaybook:
          type: string
          description: YAML body of the install playbook.
        statusPlaybook:
          type: string
          description: YAML body of the status playbook.
        removePlaybook:
          type: string
          description: YAML body of the optional remove playbook. Empty when the installer does not declare one.
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExporterDefinitionInput:
      type: object
      required: [id, displayName, appliesToPkgManager, exporterKind, bindPort, installPlaybook, statusPlaybook]
      properties:
        id:
          type: string
          description: Bare slug or full `custom.<slug>` id. The server prepends `custom.` if absent.
        displayName: { type: string }
        description: { type: string }
        appliesToPkgManager: { type: string }
        exporterKind: { $ref: "#/components/schemas/ExporterKind" }
        bindPort: { type: integer }
        installPlaybook:
          type: string
          description: 64 KB cap; must pass `ansible-playbook --syntax-check` and the inline-credential heuristic.
        statusPlaybook: { type: string }
        removePlaybook: { type: string }

    ExporterDefinitionPatch:
      type: object
      required: [displayName, appliesToPkgManager, exporterKind, bindPort, installPlaybook, statusPlaybook]
      properties:
        displayName: { type: string }
        description: { type: string }
        appliesToPkgManager: { type: string }
        exporterKind: { $ref: "#/components/schemas/ExporterKind" }
        bindPort: { type: integer }
        installPlaybook: { type: string }
        statusPlaybook: { type: string }
        removePlaybook: { type: string }

    SystemExporter:
      type: object
      required: [exporterId, source, displayName, description, appliesToPkgManager, exporterKind, bindPort, hasRemove, availability, installed]
      properties:
        exporterId: { type: string }
        source: { $ref: "#/components/schemas/ExporterSource" }
        displayName: { type: string }
        description: { type: string }
        appliesToPkgManager: { type: string }
        exporterKind: { $ref: "#/components/schemas/ExporterKind" }
        bindPort: { type: integer }
        hasRemove:
          type: boolean
          description: True when the installer declares a remove playbook (gates the Remove button in the UI).
        availability: { $ref: "#/components/schemas/ExporterAvailability" }
        installed:
          type: boolean
          description: True when system_exporters has a non-removed row for this (system, exporter).
        state: { $ref: "#/components/schemas/ExporterState" }
        port: { type: integer }
        serviceName: { type: string }
        lastStatusAt: { type: string, format: date-time }
        lastInstallAt: { type: string, format: date-time }
        lastReason: { type: string }

    SystemExportersResponse:
      type: object
      required: [scrapeMode, detectedPkgManagers, exporters]
      properties:
        scrapeMode: { $ref: "#/components/schemas/ExporterScrapeMode" }
        detectedPkgManagers:
          type: array
          items: { type: string }
          description: Updater ids the most recent inspection found on the system. Empty when no inspection has run yet.
        exporters:
          type: array
          items: { $ref: "#/components/schemas/SystemExporter" }

    ExporterRunResult:
      type: object
      required: [runId, exporterId, kind, status, exitCode, state, durationMs]
      properties:
        runId: { type: string }
        exporterId: { type: string }
        kind: { $ref: "#/components/schemas/ExporterRunKind" }
        status: { $ref: "#/components/schemas/UpdaterRunStatus" }
        exitCode: { type: integer }
        state: { $ref: "#/components/schemas/ExporterState" }
        port: { type: integer }
        service: { type: string }
        reason: { type: string }
        durationMs: { type: integer }

    ExporterRun:
      type: object
      required: [id, systemId, exporterId, kind, startedAt]
      properties:
        id: { type: string }
        systemId: { type: string }
        exporterId: { type: string }
        kind: { $ref: "#/components/schemas/ExporterRunKind" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode: { type: integer }
        actorId: { type: string }
        playbookSha: { type: string }
        logTail: { type: string }
