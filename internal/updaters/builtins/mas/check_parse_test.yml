- name: Test mas check parsing
  hosts: localhost
  gather_facts: false
  vars:
    mas_pending_typical:
      stdout_lines:
        - "1352778147  Bitwarden  (2026.4.0 -> 2026.5.0)"
        - " 640199958  Developer  (11.0     -> 11.0.1)"
        - "1616831348  Affinity Photo 2  (2.0.4 -> 2.0.5)"
    mas_pending_empty:
      stdout_lines: []
  tasks:
    - name: Parse typical mas outdated output
      ansible.builtin.set_fact:
        typical_pkgs: >-
          {{ mas_pending_typical.stdout_lines
             | select('match', '^\s*[0-9]+\s+.+\(\s*\S+\s*->\s*\S+\s*\)')
             | map('regex_replace', '^\s*[0-9]+\s+(.+?)\s+\(\s*(\S+)\s*->\s*(\S+)\s*\).*$', '\1|\2|\3')
             | list }}
    - name: Assert typical extracts name|old|new tuples (display name may contain spaces; id may be space-padded; versions may be space-padded inside the parens)
      ansible.builtin.assert:
        that:
          - typical_pkgs == ['Bitwarden|2026.4.0|2026.5.0', 'Developer|11.0|11.0.1', 'Affinity Photo 2|2.0.4|2.0.5']
        fail_msg: "typical_pkgs={{ typical_pkgs }}"
    - name: Parse empty mas outdated output
      ansible.builtin.set_fact:
        empty_pkgs: >-
          {{ mas_pending_empty.stdout_lines
             | select('match', '^\s*[0-9]+\s+.+\(\s*\S+\s*->\s*\S+\s*\)')
             | map('regex_replace', '^\s*[0-9]+\s+(.+?)\s+\(\s*(\S+)\s*->\s*(\S+)\s*\).*$', '\1|\2|\3')
             | list }}
    - name: Assert empty produces empty list
      ansible.builtin.assert:
        that:
          - empty_pkgs == []
        fail_msg: "empty_pkgs={{ empty_pkgs }}, want []"
