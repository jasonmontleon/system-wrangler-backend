- name: Apply pending Mac App Store updates
  hosts: all
  gather_facts: false
  become: false
  environment:
    PATH: '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin'
  tasks:
    - name: Run mas upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: mas upgrade
      register: mas_result
      changed_when: mas_result.stdout is search('^==> Installed ', multiline=True)
    - name: Compute upgraded app count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ mas_result.stdout_lines
             | default([])
             | select('match', '^==> Installed ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
