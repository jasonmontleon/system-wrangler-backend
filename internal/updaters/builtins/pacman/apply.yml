- name: Apply pending pacman updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
  tasks:
    - name: Compose the pacman command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_pacman_cmd: >-
          {%- set ignore = '' -%}
          {%- if sw_excluded_packages | length > 0 -%}
            {%- set ignore = ' --ignore ' ~ (sw_excluded_packages | join(',')) -%}
          {%- endif -%}
          {%- if sw_targeted_packages | length > 0 -%}
          pacman -S --noconfirm{{ ignore }} {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          pacman -Syu --noconfirm{{ ignore }}
          {%- endif -%}

    - name: Run pacman upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "{{ sw_pacman_cmd }}"
      register: pacman_result
      changed_when: pacman_result.stdout is search('^upgrading ', multiline=True)
    - name: Compute upgraded package count from the progress lines
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pacman_result.stdout_lines
             | default([])
             | select('match', '^upgrading ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
