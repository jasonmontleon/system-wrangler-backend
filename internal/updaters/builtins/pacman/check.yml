- name: List pending pacman updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Sync pacman database  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pacman -Sy
      register: pacman_sync
      changed_when: false
    - name: Query pacman for upgradable packages  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pacman -Qu
      register: pacman_pending
      changed_when: false
      failed_when: pacman_pending.rc not in [0, 1]
    - name: Extract name|old|new tuples (pacman -Qu prints "name old -> new")
      ansible.builtin.set_fact:
        sw_pending_packages: >-
          {{ pacman_pending.stdout_lines
             | reject('equalto', '')
             | map('regex_replace', '^(\S+)\s+(\S+)\s+->\s+(\S+).*$', '\1|\2|\3')
             | list }}
    - name: Surface count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_pending_packages | length }}"
    - name: Surface each pending package
      ansible.builtin.debug:
        msg: "SW_PENDING_PACKAGE: {{ item }}"
      loop: "{{ sw_pending_packages }}"
