- name: Apply pending APT updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Run apt dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      register: apt_result
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Compute upgraded package count from the dpkg trace
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ apt_result.stdout_lines
             | default([])
             | select('match', '^Setting up ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
