- name: Apply pending APT updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
    sw_currently_held: []
  tasks:
    - name: List host-side apt holds
      ansible.builtin.command: apt-mark showhold
      register: sw_apt_holds_raw
      changed_when: false
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Compute hold reconcile sets
      ansible.builtin.set_fact:
        sw_actual_held: "{{ sw_apt_holds_raw.stdout_lines | default([]) | reject('equalto', '') | list }}"
        sw_to_hold: >-
          {{ sw_excluded_packages | difference(sw_apt_holds_raw.stdout_lines | default([])) }}
        sw_to_unhold: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | intersect(sw_apt_holds_raw.stdout_lines | default([])) }}
        sw_drift_reaped: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | difference(sw_apt_holds_raw.stdout_lines | default([])) }}

    - name: Apply new apt holds  # noqa: command-instead-of-module
      ansible.builtin.command: "apt-mark hold {{ item }}"
      loop: "{{ sw_to_hold }}"
      changed_when: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Clear apt holds we no longer manage  # noqa: command-instead-of-module
      ansible.builtin.command: "apt-mark unhold {{ item }}"
      loop: "{{ sw_to_unhold }}"
      changed_when: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Surface holds-added count
      ansible.builtin.debug:
        msg: "SW_HOLDS_ADDED: {{ sw_to_hold | length }}"
    - name: Surface holds-removed count
      ansible.builtin.debug:
        msg: "SW_HOLDS_REMOVED: {{ sw_to_unhold | length }}"
    - name: Surface holds-drift-reaped count
      ansible.builtin.debug:
        msg: "SW_HOLDS_DRIFT_REAPED: {{ sw_drift_reaped | length }}"

    - name: Run apt dist-upgrade (all pending)
      when: sw_targeted_packages | length == 0
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      register: apt_all
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Run apt-get install --only-upgrade (targeted)
      when: sw_targeted_packages | length > 0
      ansible.builtin.apt:
        name: "{{ sw_targeted_packages }}"
        state: latest  # noqa: package-latest
        update_cache: true
        only_upgrade: true
      register: apt_targeted
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Pick whichever apt run executed
      ansible.builtin.set_fact:
        apt_result: "{{ apt_targeted if sw_targeted_packages | length > 0 else apt_all }}"

    - name: Compute upgraded package count from the dpkg trace
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ apt_result.stdout_lines
             | default([])
             | select('match', '^Setting up ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
