- name: List pending snap refreshes
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Query snap for available refreshes
      ansible.builtin.command:
        cmd: snap refresh --list
      register: snap_pending
      changed_when: false
      failed_when: snap_pending.rc not in [0, 1]
    - name: Extract snap names (drop header and "all up to date" line)
      ansible.builtin.set_fact:
        sw_pending_packages: >-
          {{ snap_pending.stdout_lines
             | reject('match', '^Name ')
             | reject('match', '^All snaps up to date')
             | reject('equalto', '')
             | map('regex_replace', '^([^ ]+) .*$', '\1')
             | list }}
    - name: Surface count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_pending_packages | length }}"
    - name: Surface each pending snap
      ansible.builtin.debug:
        msg: "SW_PENDING_PACKAGE: {{ item }}"
      loop: "{{ sw_pending_packages }}"
