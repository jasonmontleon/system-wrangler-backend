- name: List pending NetBSD pkgin updates
  hosts: all
  gather_facts: false
  become: true
  environment:
    PATH: "/usr/pkg/sbin:/usr/pkg/bin:/sbin:/usr/sbin:/bin:/usr/bin"
  tasks:
    - name: Update pkgin database  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pkgin -y update
      register: pkgin_update
      changed_when: false
    - name: Query pkgin for upgradable packages  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pkgin -n upgrade
      register: pkgin_pending
      changed_when: false
      failed_when:
        - pkgin_pending.rc != 0
        - pkgin_pending.rc != 1
    - name: Extract name|old|new tuples from the upgrade plan
      ansible.builtin.set_fact:
        sw_pending_packages: >-
          {{ pkgin_pending.stdout_lines
             | select('match', '^\s*\S+-[0-9]')
             | map('regex_replace', '^\s*(\S+?)-([0-9]\S*)\s+to be replaced by\s+(?:\S+-)?(\S+)\s*$', '\1|\2|\3')
             | map('regex_replace', '^\s*([^|\s]+?)-([0-9][^|\s]*)\s*$', '\1||\2')
             | list }}
    - name: Surface count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_pending_packages | length }}"
    - name: Surface each pending package
      ansible.builtin.debug:
        msg: "SW_PENDING_PACKAGE: {{ item }}"
      loop: "{{ sw_pending_packages }}"
