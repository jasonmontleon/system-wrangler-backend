- name: Apply pending NetBSD pkgin updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
  tasks:
    - name: Compose the pkgin command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_pkgin_cmd: >-
          {%- if sw_targeted_packages | length > 0 -%}
          pkgin -y install {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          pkgin -y upgrade
          {%- endif -%}

    - name: Run pkgin upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "{{ sw_pkgin_cmd }}"
      register: pkgin_result
      changed_when: pkgin_result.stdout is search('^(installing|upgrading|replacing) ', multiline=True)
    - name: Compute upgraded package count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pkgin_result.stdout_lines
             | default([])
             | select('match', '^(installing|upgrading|replacing) ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
