- name: Test NetBSD pkgin check parsing
  hosts: localhost
  gather_facts: false
  vars:
    pkgin_pending_typical:
      stdout_lines:
        - "calculating dependencies... done."
        - ""
        - "3 packages to be upgraded:"
        - "  bash-5.2.21 to be replaced by bash-5.2.32"
        - "  curl-8.5.0 to be replaced by curl-8.6.0"
        - "  py311-requests-2.32.0nb1 to be replaced by py311-requests-2.33.0"
        - ""
        - "0 to install, 3 to upgrade, 0 to refresh, 0 to downgrade, 0 to remove."
        - ""
        - "proceed ? [Y/n]"
        - "abort."
    pkgin_pending_terse:
      stdout_lines:
        - "calculating dependencies... done."
        - ""
        - "2 packages to be upgraded:"
        - "  bash-5.2.32"
        - "  curl-8.6.0"
    pkgin_pending_unindented:
      stdout_lines:
        - "calculating dependencies...done."
        - ""
        - "1 package to upgrade:"
        - "vim-share-9.2.0461"
        - ""
        - "0 to remove, 0 to refresh, 1 to upgrade, 0 to install"
        - "5831K to download, 211K of additional disk space will be used"
    pkgin_pending_empty:
      stdout_lines:
        - "calculating dependencies... done."
        - ""
        - "nothing to upgrade."
  tasks:
    - name: Parse typical pkgin -n upgrade output
      ansible.builtin.set_fact:
        typical_pkgs: >-
          {{ pkgin_pending_typical.stdout_lines
             | select('match', '^\s*\S+-[0-9]')
             | map('regex_replace', '^\s*(\S+?)-([0-9]\S*)\s+to be replaced by\s+(?:\S+-)?(\S+)\s*$', '\1|\2|\3')
             | map('regex_replace', '^\s*([^|\s]+?)-([0-9][^|\s]*)\s*$', '\1||\2')
             | list }}
    - name: Assert typical extracts name|old|new tuples
      ansible.builtin.assert:
        that:
          - typical_pkgs == ['bash|5.2.21|5.2.32', 'curl|8.5.0|8.6.0', 'py311-requests|2.32.0nb1|2.33.0']
        fail_msg: "typical_pkgs={{ typical_pkgs }}"
    - name: Parse terse pkgin -n upgrade output (only new pkgname shown — old version unknown)
      ansible.builtin.set_fact:
        terse_pkgs: >-
          {{ pkgin_pending_terse.stdout_lines
             | select('match', '^\s*\S+-[0-9]')
             | map('regex_replace', '^\s*(\S+?)-([0-9]\S*)\s+to be replaced by\s+(?:\S+-)?(\S+)\s*$', '\1|\2|\3')
             | map('regex_replace', '^\s*([^|\s]+?)-([0-9][^|\s]*)\s*$', '\1||\2')
             | list }}
    - name: Assert terse emits empty old version
      ansible.builtin.assert:
        that:
          - terse_pkgs == ['bash||5.2.32', 'curl||8.6.0']
        fail_msg: "terse_pkgs={{ terse_pkgs }}"
    - name: Parse unindented pkgin -n upgrade output (no-TTY format)
      ansible.builtin.set_fact:
        unindented_pkgs: >-
          {{ pkgin_pending_unindented.stdout_lines
             | select('match', '^\s*\S+-[0-9]')
             | map('regex_replace', '^\s*(\S+?)-([0-9]\S*)\s+to be replaced by\s+(?:\S+-)?(\S+)\s*$', '\1|\2|\3')
             | map('regex_replace', '^\s*([^|\s]+?)-([0-9][^|\s]*)\s*$', '\1||\2')
             | list }}
    - name: Assert unindented emits empty old version
      ansible.builtin.assert:
        that:
          - unindented_pkgs == ['vim-share||9.2.0461']
        fail_msg: "unindented_pkgs={{ unindented_pkgs }}"
    - name: Parse empty pkgin -n upgrade output
      ansible.builtin.set_fact:
        empty_pkgs: >-
          {{ pkgin_pending_empty.stdout_lines
             | select('match', '^\s*\S+-[0-9]')
             | map('regex_replace', '^\s*(\S+?)-([0-9]\S*)\s+to be replaced by\s+(?:\S+-)?(\S+)\s*$', '\1|\2|\3')
             | map('regex_replace', '^\s*([^|\s]+?)-([0-9][^|\s]*)\s*$', '\1||\2')
             | list }}
    - name: Assert empty produces empty list
      ansible.builtin.assert:
        that:
          - empty_pkgs == []
        fail_msg: "empty_pkgs={{ empty_pkgs }}, want []"
