- name: Apply pending eopkg updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
  tasks:
    - name: Compose the eopkg command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_eopkg_cmd: >-
          {%- if sw_targeted_packages | length > 0 -%}
          eopkg upgrade -y {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          eopkg upgrade -y
          {%- endif -%}

    - name: Run eopkg upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "{{ sw_eopkg_cmd }}"
      register: eopkg_result
      changed_when: eopkg_result.stdout is search('^(Installing|Upgrading|Updating) ', multiline=True)
    - name: Compute upgraded package count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ eopkg_result.stdout_lines
             | default([])
             | select('match', '^(Installing|Upgrading|Updating) ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
