- name: Test OpenBSD pkg_add check parsing
  hosts: localhost
  gather_facts: false
  vars:
    pkg_add_pending_typical:
      stdout_lines:
        - "quirks-7.147 signed on 2025-10-10T23:15:26Z"
        - "Update candidates: curl-8.15.0 -> curl-8.19.0"
        - "curl-8.15.0->8.19.0 (processing)(pretending) "
        - "curl-8.15.0 (hashing)(pretending) "
        - "curl-8.19.0 (extracting)(pretending) "
        - "curl-8.19.0 (installing)(pretending) "
        - "Adding curl-8.15.0->8.19.0(pretending) "
        - "Update candidates: libpng16-1.6.50 -> libpng16-1.6.50"
        - "libpng16-1.6.50->1.6.50 (processing)(pretending) "
        - "Update candidates: firefox-esr-115.4.0 -> firefox-esr-115.5.0"
        - "firefox-esr-115.4.0->115.5.0 (processing)(pretending) "
        - "Adding firefox-esr-115.4.0->115.5.0(pretending) "
    pkg_add_pending_empty:
      stdout_lines:
        - "quirks-7.147 signed on 2025-10-10T23:15:26Z"
        - "Update candidates: curl-8.19.0 -> curl-8.19.0"
        - "curl-8.19.0->8.19.0 (processing)(pretending) "
  tasks:
    - name: Parse typical pkg_add -unv output
      ansible.builtin.set_fact:
        typical_pkgs: >-
          {{ pkg_add_pending_typical.stdout_lines
             | select('match', '^Adding \S+->')
             | map('regex_replace', '^Adding (\S+?)-([0-9]\S*)->(?:\S+-)?(\S+?)(?:\(pretending\))?\s*$', '\1|\2|\3')
             | list }}
    - name: Assert typical extracts name|old|new for packages with version changes
      ansible.builtin.assert:
        that:
          - typical_pkgs == ['curl|8.15.0|8.19.0', 'firefox-esr|115.4.0|115.5.0']
        fail_msg: "typical_pkgs={{ typical_pkgs }}"
    - name: Parse empty (no Adding lines) pkg_add -unv output
      ansible.builtin.set_fact:
        empty_pkgs: >-
          {{ pkg_add_pending_empty.stdout_lines
             | select('match', '^Adding \S+->')
             | map('regex_replace', '^Adding (\S+?)-([0-9]\S*)->(?:\S+-)?(\S+?)(?:\(pretending\))?\s*$', '\1|\2|\3')
             | list }}
    - name: Assert empty produces empty list
      ansible.builtin.assert:
        that:
          - empty_pkgs == []
        fail_msg: "empty_pkgs={{ empty_pkgs }}, want []"
