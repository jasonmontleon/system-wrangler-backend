- name: List pending OpenBSD pkg_add updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Dry-run pkg_add -u to enumerate pending packages
      ansible.builtin.command:
        cmd: pkg_add -unv
      register: pkg_add_pending
      changed_when: false
    - name: Extract package names from "Adding ..." lines
      ansible.builtin.set_fact:
        sw_pending_packages: >-
          {{ pkg_add_pending.stdout_lines
             | select('match', '^Adding \S+->')
             | map('regex_replace', '^Adding (\S+?)-[0-9]\S*->.*$', '\1')
             | list }}
    - name: Surface count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_pending_packages | length }}"
    - name: Surface each pending package
      ansible.builtin.debug:
        msg: "SW_PENDING_PACKAGE: {{ item }}"
      loop: "{{ sw_pending_packages }}"
