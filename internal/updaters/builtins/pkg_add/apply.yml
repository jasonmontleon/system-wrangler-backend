- name: Apply pending OpenBSD pkg_add updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Run pkg_add -u
      ansible.builtin.command:
        cmd: pkg_add -uI
      register: pkg_add_result
      changed_when: pkg_add_result.stdout is search(' to update ', multiline=True)
    - name: Compute upgraded package count from "to update" lines
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pkg_add_result.stdout_lines
             | default([])
             | select('search', ' to update ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
