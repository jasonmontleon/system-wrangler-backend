- name: Apply pending OpenBSD pkg_add updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
  tasks:
    - name: Compose the pkg_add command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_pkg_add_cmd: >-
          {%- if sw_targeted_packages | length > 0 -%}
          pkg_add -uvI {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          pkg_add -uvI
          {%- endif -%}

    - name: Run pkg_add -u
      ansible.builtin.command:
        cmd: "{{ sw_pkg_add_cmd }}"
      register: pkg_add_result
      changed_when: >-
        pkg_add_result.stdout is search('^Adding \S+->', multiline=True)
    - name: Compute upgraded package count from "Adding ..." lines
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pkg_add_result.stdout_lines
             | default([])
             | select('match', '^Adding \S+->')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
