- name: Apply pending Windows Update items
  hosts: all
  gather_facts: false
  become: false
  vars:
    sw_targeted_packages: []
  tasks:
    - name: Install pending updates via the win_updates scheduled-task wrapper
      ansible.windows.win_updates:
        state: installed
        reboot: false
        kb_filter: "{{ sw_targeted_packages if sw_targeted_packages | length > 0 else omit }}"
      register: wu_result
    - name: Surface install count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ wu_result.installed_update_count | default(0) }}"
    - name: Probe Windows reboot-required registry signals
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        $needed = $false
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $needed = $true }
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $needed = $true }
        $sm = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name 'PendingFileRenameOperations' -ErrorAction SilentlyContinue
        if ($sm -and $sm.PendingFileRenameOperations) { $needed = $true }
        $uev = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Updates' -Name 'UpdateExeVolatile' -ErrorAction SilentlyContinue
        if ($uev -and ($uev.UpdateExeVolatile -ne 0)) { $needed = $true }
        if ($needed) { Write-Output '1' } else { Write-Output '0' }
        exit 0
      register: sw_reboot_probe
      changed_when: false
    - name: Surface reboot-required marker when the registry agrees
      ansible.builtin.debug:
        msg: "SW_REBOOT_REQUIRED: 1"
      when: (sw_reboot_probe.stdout_lines | default([]) | first | default('0')) | trim == '1'
