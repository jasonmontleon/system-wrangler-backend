- name: List pending Microsoft Store app updates
  hosts: all
  gather_facts: false
  become: false
  tasks:
    # AppInstallManager is the only headless way to enumerate Store/UWP
    # updates. Current Windows exposes only the three-arg
    # SearchForAllUpdatesAsync (the two-arg overload was removed), so pass
    # an AppUpdateOptions with AutomaticallyDownloadAndInstallUpdateIfFound
    # disabled: a check reads the returned list and never installs. The
    # AsTask bridge lives in System.Runtime.WindowsRuntime, which is not
    # loaded by default, so Add-Type it first. Any failure (Server / LTSC
    # without the Store, older OS, missing capability) still reports
    # nothing pending rather than erroring, but the exception text goes to
    # stderr so it surfaces in the run log as SW_DIAG instead of being
    # silently swallowed into a false "0 pending". Note: on recent Windows
    # this API may return nothing even when the Store UI shows updates
    # (framework re-offers like WindowsAppRuntime are not enumerated here).
    - name: Search the Store for available app updates (read-only; no install)
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        try {
            Add-Type -AssemblyName System.Runtime.WindowsRuntime -ErrorAction Stop
            $ext = 'System.WindowsRuntimeSystemExtensions' -as [type]
            if ($null -eq $ext) { throw 'System.Runtime.WindowsRuntime unavailable' }
            $mgr = [Windows.ApplicationModel.Store.Preview.InstallControl.AppInstallManager, Windows.ApplicationModel.Store.Preview.InstallControl, ContentType=WindowsRuntime]::new()
            $opts = [Windows.ApplicationModel.Store.Preview.InstallControl.AppUpdateOptions, Windows.ApplicationModel.Store.Preview.InstallControl, ContentType=WindowsRuntime]::new()
            $opts.AutomaticallyDownloadAndInstallUpdateIfFound = $false
            $itemType = [Windows.ApplicationModel.Store.Preview.InstallControl.AppInstallItem, Windows.ApplicationModel.Store.Preview.InstallControl, ContentType=WindowsRuntime]
            $listType = [System.Collections.Generic.IReadOnlyList`1].MakeGenericType($itemType)
            $asTask = ($ext.GetMethods() | Where-Object { $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' })[0]
            $op = $mgr.SearchForAllUpdatesAsync('', '', $opts)
            $task = $asTask.MakeGenericMethod($listType).Invoke($null, @($op))
            $task.Wait(-1) | Out-Null
            foreach ($item in @($task.Result)) {
                if ($item.PackageFamilyName) { Write-Output $item.PackageFamilyName }
            }
        } catch {
            [Console]::Error.WriteLine("msstore check error: " + $_.Exception.Message)
        }
        exit 0
      register: msstore_pending
      changed_when: false
      failed_when: msstore_pending.rc not in [0]
    - name: Extract pending package-family names
      ansible.builtin.set_fact:
        sw_pending_packages: >-
          {{ msstore_pending.stdout_lines
             | default([])
             | reject('match', '^\s*$')
             | reject('equalto', '')
             | list }}
    - name: Surface count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_pending_packages | length }}"
    - name: Surface each pending Store app
      ansible.builtin.debug:
        msg: "SW_PENDING_PACKAGE: {{ item }}"
      loop: "{{ sw_pending_packages }}"
    - name: Surface check diagnostics to the run log
      ansible.builtin.debug:
        msg: "SW_DIAG: {{ item }}"
      loop: >-
        {{ msstore_pending.stderr_lines | default([])
           | reject('match', '^\s*$') | list }}
