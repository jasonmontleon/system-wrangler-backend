- name: Upgrade winget packages
  hosts: all
  gather_facts: false
  become: false
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
  tasks:
    - name: Compose winget --id flag list (targeted only)
      when: sw_targeted_packages | length > 0
      ansible.builtin.set_fact:
        sw_winget_id_flags: >-
          {{ sw_targeted_packages | map('regex_replace', '^', '--id ') | list | join(' ') }}

    - name: Compose winget --exclude flag list (excludes only)
      ansible.builtin.set_fact:
        sw_winget_exclude_flags: >-
          {{ sw_excluded_packages | map('regex_replace', '^', '--exclude ') | list | join(' ') }}

    - name: Run winget upgrade --all (all pending)
      when: sw_targeted_packages | length == 0
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        winget upgrade --all {{ sw_winget_exclude_flags }} --silent --include-unknown `
          --accept-source-agreements --accept-package-agreements `
          --disable-interactivity
        exit $LASTEXITCODE
      register: winget_all
      changed_when: winget_all.stdout != ''
      failed_when: winget_all.rc not in [0]

    - name: Run winget upgrade (targeted IDs)
      when: sw_targeted_packages | length > 0
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        winget upgrade --exact {{ sw_winget_id_flags }} {{ sw_winget_exclude_flags }} --silent --include-unknown `
          --accept-source-agreements --accept-package-agreements `
          --disable-interactivity
        exit $LASTEXITCODE
      register: winget_targeted
      changed_when: winget_targeted.stdout != ''
      failed_when: winget_targeted.rc not in [0]

    - name: Pick whichever winget run executed
      ansible.builtin.set_fact:
        winget_result: "{{ winget_targeted if sw_targeted_packages | length > 0 else winget_all }}"
    - name: Compute upgraded count from "Successfully installed" lines
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ winget_result.stdout_lines
             | default([])
             | select('search', '^Successfully installed')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
