- name: Upgrade all winget packages
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Run winget upgrade --all
      ansible.windows.win_shell: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        winget upgrade --all --silent --include-unknown `
          --accept-source-agreements --accept-package-agreements `
          --disable-interactivity
        exit $LASTEXITCODE
      register: winget_result
      changed_when: winget_result.stdout != ''
      failed_when: winget_result.rc not in [0]
    - name: Compute upgraded count from "Successfully installed" lines
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ winget_result.stdout_lines
             | default([])
             | select('search', '^Successfully installed')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
