- name: Test apk check parsing
  hosts: localhost
  gather_facts: false
  vars:
    apk_pending_typical:
      stdout_lines:
        - "Installed:                                Available:"
        - "busybox-1.36.1-r0                   <   1.36.2-r0"
        - "libcrypto3-3.1.3-r0                 <   3.1.4-r0"
        - "ca-certificates-bundle-20240226-r0  <   20240705-r0"
    apk_pending_empty:
      stdout_lines:
        - "Installed:                                Available:"
  tasks:
    - name: Parse typical apk version -l '<' output
      ansible.builtin.set_fact:
        typical_pkgs: >-
          {{ apk_pending_typical.stdout_lines
             | reject('match', '^Installed:')
             | reject('equalto', '')
             | map('regex_replace', '^(.+)-([^-\s]+-r[0-9]+)\s+<\s+(\S+).*$', '\1|\2|\3')
             | list }}
    - name: Assert typical extracts name|old|new tuples
      ansible.builtin.assert:
        that:
          - typical_pkgs == ['busybox|1.36.1-r0|1.36.2-r0', 'libcrypto3|3.1.3-r0|3.1.4-r0', 'ca-certificates-bundle|20240226-r0|20240705-r0']
        fail_msg: "typical_pkgs={{ typical_pkgs }}"
    - name: Parse empty apk output
      ansible.builtin.set_fact:
        empty_pkgs: >-
          {{ apk_pending_empty.stdout_lines
             | reject('match', '^Installed:')
             | reject('equalto', '')
             | map('regex_replace', '^(.+)-([^-\s]+-r[0-9]+)\s+<\s+(\S+).*$', '\1|\2|\3')
             | list }}
    - name: Assert empty produces empty list
      ansible.builtin.assert:
        that:
          - empty_pkgs == []
        fail_msg: "empty_pkgs={{ empty_pkgs }}, want []"
