- name: Apply pending Homebrew updates
  hosts: all
  gather_facts: false
  become: false
  environment:
    PATH: '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin'
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
    sw_currently_held: []
  tasks:
    - name: List host-side brew pins  # noqa: command-instead-of-module
      ansible.builtin.command: brew list --pinned
      register: sw_brew_holds_raw
      changed_when: false

    - name: Compute hold reconcile sets
      ansible.builtin.set_fact:
        sw_actual_held: "{{ sw_brew_holds_raw.stdout_lines | default([]) | reject('equalto', '') | list }}"
        sw_to_hold: >-
          {{ sw_excluded_packages | difference(sw_brew_holds_raw.stdout_lines | default([])) }}
        sw_to_unhold: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | intersect(sw_brew_holds_raw.stdout_lines | default([])) }}
        sw_drift_reaped: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | difference(sw_brew_holds_raw.stdout_lines | default([])) }}

    - name: Apply new brew pins  # noqa: command-instead-of-module
      ansible.builtin.command: "brew pin {{ item }}"
      loop: "{{ sw_to_hold }}"
      changed_when: true

    - name: Clear brew pins we no longer manage  # noqa: command-instead-of-module
      ansible.builtin.command: "brew unpin {{ item }}"
      loop: "{{ sw_to_unhold }}"
      changed_when: true

    - name: Surface holds-added count
      ansible.builtin.debug:
        msg: "SW_HOLDS_ADDED: {{ sw_to_hold | length }}"
    - name: Surface holds-removed count
      ansible.builtin.debug:
        msg: "SW_HOLDS_REMOVED: {{ sw_to_unhold | length }}"
    - name: Surface holds-drift-reaped count
      ansible.builtin.debug:
        msg: "SW_HOLDS_DRIFT_REAPED: {{ sw_drift_reaped | length }}"

    - name: Compose the brew command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_brew_cmd: >-
          {%- if sw_targeted_packages | length > 0 -%}
          brew upgrade {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          brew upgrade
          {%- endif -%}

    - name: Run brew upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "{{ sw_brew_cmd }}"
      register: brew_result
      changed_when: brew_result.stdout is search('^==> Upgrading ', multiline=True)
    - name: Compute upgraded package count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ brew_result.stdout_lines
             | default([])
             | select('match', '^==> Upgrading ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
