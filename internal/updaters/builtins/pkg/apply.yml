- name: Apply pending FreeBSD pkg updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
  tasks:
    - name: Compose the pkg command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_pkg_cmd: >-
          {%- set excludes = ' ' ~ (sw_excluded_packages
                                    | map('regex_replace', '^', '-x ')
                                    | join(' '))
            if sw_excluded_packages | length > 0 else '' -%}
          {%- if sw_targeted_packages | length > 0 -%}
          pkg upgrade -y{{ excludes }} {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          pkg upgrade -y{{ excludes }}
          {%- endif -%}

    - name: Run pkg upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "{{ sw_pkg_cmd }}"
      register: pkg_result
      changed_when: pkg_result.stdout is search('^\[[0-9]+/[0-9]+\] (Upgrading|Installing|Reinstalling) ', multiline=True)
    - name: Compute upgraded package count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pkg_result.stdout_lines
             | default([])
             | select('match', '^\[[0-9]+/[0-9]+\] (Upgrading|Installing|Reinstalling) ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
