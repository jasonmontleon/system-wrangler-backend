- name: Apply pending FreeBSD pkg updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Run pkg upgrade  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: pkg upgrade -y
      register: pkg_result
      changed_when: pkg_result.stdout is search('^\[[0-9]+/[0-9]+\] (Upgrading|Installing|Reinstalling) ', multiline=True)
    - name: Compute upgraded package count from progress markers
      ansible.builtin.set_fact:
        sw_upgraded_count: >-
          {{ pkg_result.stdout_lines
             | default([])
             | select('match', '^\[[0-9]+/[0-9]+\] (Upgrading|Installing|Reinstalling) ')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_upgraded_count }}"
