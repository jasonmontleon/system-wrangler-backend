- name: Apply pending DNF updates
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Run dnf upgrade  # noqa: package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: dnf_result
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ dnf_result.results | default([]) | length }}"
