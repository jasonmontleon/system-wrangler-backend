- name: Apply pending flatpak updates
  hosts: all
  gather_facts: false
  become: true
  vars:
    sw_targeted_packages: []
    sw_excluded_packages: []
    sw_currently_held: []
  tasks:
    - name: List host-side flatpak masks
      ansible.builtin.command: flatpak --system mask
      register: sw_flatpak_holds_raw
      changed_when: false
      failed_when: false

    - name: Compute hold reconcile sets
      ansible.builtin.set_fact:
        sw_actual_held: "{{ sw_flatpak_holds_raw.stdout_lines | default([]) | reject('equalto', '') | list }}"
        sw_to_hold: >-
          {{ sw_excluded_packages | difference(sw_flatpak_holds_raw.stdout_lines | default([])) }}
        sw_to_unhold: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | intersect(sw_flatpak_holds_raw.stdout_lines | default([])) }}
        sw_drift_reaped: >-
          {{ (sw_currently_held | difference(sw_excluded_packages))
             | difference(sw_flatpak_holds_raw.stdout_lines | default([])) }}

    - name: Apply new flatpak masks
      ansible.builtin.command: "flatpak --system mask {{ item }}"
      loop: "{{ sw_to_hold }}"
      changed_when: true

    - name: Clear flatpak masks we no longer manage
      ansible.builtin.command: "flatpak --system mask --remove {{ item }}"
      loop: "{{ sw_to_unhold }}"
      changed_when: true

    - name: Surface holds-added count
      ansible.builtin.debug:
        msg: "SW_HOLDS_ADDED: {{ sw_to_hold | length }}"
    - name: Surface holds-removed count
      ansible.builtin.debug:
        msg: "SW_HOLDS_REMOVED: {{ sw_to_unhold | length }}"
    - name: Surface holds-drift-reaped count
      ansible.builtin.debug:
        msg: "SW_HOLDS_DRIFT_REAPED: {{ sw_drift_reaped | length }}"

    - name: Compose the flatpak command (all-pending vs targeted)
      ansible.builtin.set_fact:
        sw_flatpak_cmd: >-
          {%- if sw_targeted_packages | length > 0 -%}
          flatpak --system update --assumeyes --noninteractive {{ sw_targeted_packages | join(' ') }}
          {%- else -%}
          flatpak --system update --assumeyes --noninteractive
          {%- endif -%}

    - name: Run flatpak update
      ansible.builtin.command:
        cmd: "{{ sw_flatpak_cmd }}"
      register: flatpak_result
      changed_when: flatpak_result.stdout != ''
    - name: Compute updated flatpak count from the numbered changelist
      ansible.builtin.set_fact:
        sw_updated_count: >-
          {{ flatpak_result.stdout_lines
             | default([])
             | select('match', '^\s*[0-9]+\.\s')
             | list
             | length }}
    - name: Surface upgrade count to the run log
      ansible.builtin.debug:
        msg: "SW_AFFECTED_COUNT: {{ sw_updated_count }}"
