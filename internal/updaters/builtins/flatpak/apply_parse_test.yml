- name: Test flatpak apply hold-reconcile + count parsing
  hosts: localhost
  gather_facts: false
  vars:
    flatpak_masks_typical:
      stdout_lines:
        - "org.mozilla.firefox"
        - "com.spotify.Client"
    flatpak_result_typical:
      stdout_lines:
        - "Looking for updates..."
        - ""
        - "         Ref                                                  Branch   Op"
        - " 1.      app/org.example.A/x86_64/stable                      stable   u"
        - " 2.      app/org.example.B/x86_64/stable                      stable   u"
        - " 3.      runtime/org.freedesktop.Platform/x86_64/22.08        22.08    u"
        - ""
        - "Updating in system:"
        - "org.example.A stable u app          flathub  < 100.0 kB"
    flatpak_result_empty:
      stdout_lines:
        - "Looking for updates..."
        - "Nothing to do."
  tasks:
    - name: Compute hold reconcile sets — operator already masked one of our patterns
      ansible.builtin.set_fact:
        sw_excluded_packages:
          - org.mozilla.firefox
          - org.example.New
        sw_currently_held:
          - org.example.Old
        sw_actual_held: "{{ flatpak_masks_typical.stdout_lines | default([]) | reject('equalto', '') | list }}"
        sw_to_hold: >-
          {{ ['org.mozilla.firefox', 'org.example.New']
             | difference(flatpak_masks_typical.stdout_lines | default([])) }}
        sw_to_unhold: >-
          {{ (['org.example.Old'] | difference(['org.mozilla.firefox', 'org.example.New']))
             | intersect(flatpak_masks_typical.stdout_lines | default([])) }}
        sw_drift_reaped: >-
          {{ (['org.example.Old'] | difference(['org.mozilla.firefox', 'org.example.New']))
             | difference(flatpak_masks_typical.stdout_lines | default([])) }}

    - name: Assert to_hold drops the already-masked appid
      ansible.builtin.assert:
        that:
          - "'org.example.New' in sw_to_hold"
          - "'org.mozilla.firefox' not in sw_to_hold"
        fail_msg: "sw_to_hold={{ sw_to_hold }}"

    - name: Assert drift captures the tracked appid no longer host-masked
      ansible.builtin.assert:
        that:
          - sw_drift_reaped | length == 1
          - "'org.example.Old' in sw_drift_reaped"
        fail_msg: "sw_drift_reaped={{ sw_drift_reaped }}"

    - name: Count numbered changelist items in typical output
      ansible.builtin.set_fact:
        typical_count: >-
          {{ flatpak_result_typical.stdout_lines
             | default([])
             | select('match', '^\s*[0-9]+\.\s')
             | list
             | length }}
    - name: Assert typical counts the changelist entries
      ansible.builtin.assert:
        that:
          - typical_count | int == 3
        fail_msg: "typical_count={{ typical_count }}, want 3"
    - name: Count empty output
      ansible.builtin.set_fact:
        empty_count: >-
          {{ flatpak_result_empty.stdout_lines
             | default([])
             | select('match', '^\s*[0-9]+\.\s')
             | list
             | length }}
    - name: Assert empty produces zero
      ansible.builtin.assert:
        that:
          - empty_count | int == 0
        fail_msg: "empty_count={{ empty_count }}, want 0"
